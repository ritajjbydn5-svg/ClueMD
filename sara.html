<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sara | ClueMD</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #e9eef2;
      color: #17202a;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 70px;
      background: white;
      border-bottom: 1px solid #dce1e5;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      z-index: 50;
    }
    .logo {
      font-size: 23px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .back {
      color: #17202a;
      text-decoration: none;
      font-weight: 700;
    }
    .clinic {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding: 35px 20px 0;
      overflow: hidden;
      min-height: calc(100vh - 70px);
    }
    .wall {
      position: absolute;
      inset: 0;
      background: #f7f9fa;
      z-index: 0;
    }
    .window {
      position: absolute;
      top: 55px;
      right: 8%;
      width: 180px;
      height: 130px;
      background: #dcecf5;
      border: 8px solid white;
      box-shadow: 0 8px 25px rgba(0,0,0,0.06);
    }
    .window:before {
      content: "";
      position: absolute;
      left: 50%;
      top: 0;
      bottom: 0;
      width: 3px;
      background: white;
      transform: translateX(-50%);
    }
    .window:after {
      content: "";
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 3px;
      background: white;
      transform: translateY(-50%);
    }
    /*
      SARA
    */
    .sara {
      position: relative;
      z-index: 3;
      width: 310px;
      height: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s ease;
    }
    .hair {
      position: absolute;
      top: 25px;
      width: 205px;
      height: 230px;
      background: #4a3028;
      border-radius: 48% 48% 42% 42%;
      z-index: 1;
    }
    .head {
      position: absolute;
      top: 52px;
      width: 165px;
      height: 190px;
      background: #f2c7a5;
      border-radius: 48% 48% 45% 45%;
      z-index: 2;
      transition: transform 0.25s ease;
    }
    .ear {
      position: absolute;
      width: 25px;
      height: 45px;
      background: #efbd99;
      top: 120px;
      border-radius: 50%;
      z-index: 1;
    }
    .ear.left {
      left: 65px;
    }
    .ear.right {
      right: 65px;
    }
    .eye {
      position: absolute;
      top: 75px;
      width: 18px;
      height: 12px;
      background: #30241f;
      border-radius: 50%;
      transition: height 0.12s, transform 0.2s;
    }
    .eye.left {
      left: 38px;
    }
    .eye.right {
      right: 38px;
    }
    /*
      BLINK
    */
    .sara.blink .eye {
      height: 2px;
    }
    /*
      MOUTH
    */
    .mouth {
      position: absolute;
      left: 50%;
      top: 125px;
      width: 35px;
      height: 12px;
      border-bottom: 3px solid #7c3f3f;
      border-radius: 0 0 50% 50%;
      transform: translateX(-50%);
      transition: all 0.2s ease;
    }
    /*
      EXPRESSIONS
    */
    .sara.worried .mouth {
      border-bottom: none;
      border-top: 3px solid #7c3f3f;
      border-radius: 50% 50% 0 0;
    }
    .sara.pained .mouth {
      width: 28px;
      height: 20px;
      border: 3px solid #7c3f3f;
      border-radius: 50%;
    }
    .sara.surprised .mouth {
      width: 22px;
      height: 28px;
      border: 3px solid #7c3f3f;
      border-radius: 50%;
    }
    .sara.nauseous .mouth {
      width: 30px;
      height: 8px;
      border-bottom: 3px solid #7c3f3f;
      border-radius: 50%;
      transform: translateX(-50%) rotate(-5deg);
    }
    .sara.happy .mouth {
      width: 40px;
      height: 18px;
      border-bottom: 4px solid #7c3f3f;
      border-radius: 0 0 50% 50%;
    }
    /*
      BODY
    */
    .neck {
      position: absolute;
      top: 225px;
      width: 55px;
      height: 55px;
      background: #efbd99;
      z-index: 1;
    }
    .body {
      position: absolute;
      top: 260px;
      width: 245px;
      height: 260px;
      background: #8fa7b5;
      border-radius: 90px 90px 25px 25px;
      z-index: 1;
    }
    /*
      DESK
    */
    .desk {
      position: absolute;
      z-index: 5;
      bottom: 0;
      left: -10%;
      width: 120%;
      height: 145px;
      background: #8b6a50;
      box-shadow: 0 -10px 30px rgba(0,0,0,0.12);
    }
    .desk-top {
      position: absolute;
      top: -12px;
      left: 0;
      width: 100%;
      height: 20px;
      background: #76563e;
    }
    .notebook {
      position: absolute;
      z-index: 6;
      bottom: 55px;
      left: 12%;
      width: 180px;
      height: 105px;
      background: white;
      border-radius: 5px;
      transform: rotate(-4deg);
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
    }
    .pen {
      position: absolute;
      z-index: 7;
      bottom: 75px;
      left: 28%;
      width: 100px;
      height: 7px;
      background: #263746;
      transform: rotate(18deg);
      border-radius: 5px;
    }
    /*
      INFORMATION PANEL
    */
    .status {
      position: absolute;
      z-index: 10;
      top: 25px;
      left: 25px;
      background: white;
      padding: 14px 17px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
      font-size: 14px;
      font-weight: 700;
      max-width: 230px;
    }
    .name-card {
      position: absolute;
      z-index: 10;
      top: 25px;
      right: 25px;
      background: white;
      padding: 15px 18px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }
    .name-card strong {
      display: block;
      font-size: 18px;
      margin-bottom: 4px;
    }
    .name-card span {
      font-size: 12px;
      color: #6b7280;
    }
    /*
      CONTROLS
    */
    .controls {
      position: absolute;
      z-index: 20;
      bottom: 170px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: center;
      width: 90%;
    }
    button {
      border: none;
      background: #17202a;
      color: white;
      padding: 10px 14px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }
    button:hover {
      opacity: 0.85;
    }
    @media (max-width: 600px) {
      .sara {
        transform: scale(0.8);
        transform-origin: bottom center;
      }
      .window {
        display: none;
      }
      .controls {
        bottom: 160px;
      }
      .name-card {
        top: 25px;
        right: 15px;
      }
      .status {
        left: 15px;
      }
    }
  </style>
</head>
<body>
<header>
  <div class="logo">
    ClueMD
  </div>
  <a class="back" href="case001.html">
    ← Case 001
  </a>
</header>
<div class="clinic">
  <div class="wall"></div>
  <div class="window"></div>
  <div class="status" id="status">
    Sara is waiting for you...
  </div>
  <div class="name-card">
<strong>Sara</strong>
<span>17 · Case 001</span>
  </div>
  <div class="sara" id="sara">
<div class="hair"></div>
<div class="ear left"></div>
<div class="ear right"></div>
<div class="head">
  <div class="eye left"></div>
  <div class="eye right"></div>
  <div class="mouth"></div>
</div>
<div class="neck"></div>
<div class="body"></div>
  </div>
  <div class="controls">
<button onclick="expression('normal')">
  🙂 Normal
</button>
<button onclick="expression('worried')">
  😟 Worried
</button>
<button onclick="expression('pained')">
  😣 Pain
</button>
<button onclick="expression('nauseous')">
  🤢 Nauseous
</button>
<button onclick="expression('surprised')">
  😮 Surprised
</button>
<button onclick="expression('happy')">
  😊 Relieved
</button>
  </div>
  <div class="desk">
<div class="desk-top"></div>
<div class="notebook"></div>
<div class="pen"></div>
  </div>
</div>
<script>
const sara =
  document.getElementById("sara");
const statusText =
  document.getElementById("status");
/*
  AUTOMATIC BLINKING
*/
function blink() {
  sara.classList.add("blink");
  setTimeout(() => {
    sara.classList.remove("blink");
  }, 130);
}
function randomBlink() {
  blink();
  const nextBlink =
    Math.floor(Math.random() * 4000) + 2500;
  setTimeout(
    randomBlink,
    nextBlink
  );
}
randomBlink();
/*
  EXPRESSIONS
*/
function expression(type) {
  sara.classList.remove(
    "worried",
    "pained",
    "nauseous",
    "surprised",
    "happy"
  );
  if (type === "worried") {
    sara.classList.add("worried");
    statusText.textContent =
      "Sara looks worried.";
  }
  else if (type === "pained") {
    sara.classList.add("pained");
    statusText.textContent =
      "Sara looks uncomfortable.";
  }
  else if (type === "nauseous") {
    sara.classList.add("nauseous");
    statusText.textContent =
      "Sara looks nauseous.";
  }
  else if (type === "surprised") {
    sara.classList.add("surprised");
    statusText.textContent =
      "Sara looks surprised.";
  }
  else if (type === "happy") {
    sara.classList.add("happy");
    statusText.textContent =
      "Sara looks relieved.";
  }
  else {
    statusText.textContent =
      "Sara is listening...";
  }
}
</script>
</body>
</html>
