<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    overflow: hidden;
}
header {
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #ddd;
    position: relative;
    z-index: 100;
}
.logo {
    font-size: 23px;
    font-weight: bold;
}
.back {
    text-decoration: none;
    color: #18232d;
    font-weight: bold;
}
.room {
    position: relative;
    width: 100%;
    height: calc(100vh - 58px);
    overflow: hidden;
    background: #f7f9fa;
}
.patient {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
    z-index: 20;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient small {
    color: #777;
}
/* SARA */
.sara {
    position: absolute;
    width: 270px;
    height: 430px;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    z-index: 5;
}
.hair {
    position: absolute;
    top: 0;
    left: 38px;
    width: 195px;
    height: 205px;
    background: #493028;
    border-radius: 50%;
}
.ear {
    position: absolute;
    top: 105px;
    width: 22px;
    height: 40px;
    background: #efbd99;
    border-radius: 50%;
}
.ear.left {
    left: 49px;
}
.ear.right {
    right: 49px;
}
.face {
    position: absolute;
    top: 38px;
    left: 57px;
    width: 157px;
    height: 180px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
.brow {
    position: absolute;
    top: 57px;
    width: 30px;
    height: 4px;
    background: #57382e;
    border-radius: 5px;
}
.brow.left {
    left: 28px;
    transform: rotate(14deg);
}
.brow.right {
    right: 28px;
    transform: rotate(-14deg);
}
.eye {
    position: absolute;
    top: 73px;
    width: 17px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 35px;
}
.eye.right {
    right: 35px;
}
.mouth {
    position: absolute;
    top: 132px;
    left: 50%;
    width: 40px;
    height: 18px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
.neck {
    position: absolute;
    top: 210px;
    left: 109px;
    width: 52px;
    height: 55px;
    background: #efbd99;
}
.body {
    position: absolute;
    top: 250px;
    left: 13px;
    width: 245px;
    height: 220px;
    background: #8da6b5;
    border-radius: 90px 90px 20px 20px;
}
/* SPEECH */
.speech {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 430px;
    background: white;
    padding: 18px;
    border-radius: 22px;
    box-shadow: 0 6px 22px rgba(0,0,0,.15);
    z-index: 30;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
#speechText {
    font-size: 16px;
    line-height: 1.45;
}
/* DESK */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 95px;
    background: #8b6a50;
    z-index: 40;
}
/* =========================
   KEYBOARD / DIAGNOSIS BOX
========================= */
#inputBox {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 85px;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: white;
    padding: 18px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    z-index: 9999;
}
#inputBox.open {
    display: block;
}
#inputTitle {
    font-weight: bold;
    font-size: 16px;
    margin-bottom: 12px;
}
.inputRow {
    display: flex;
    gap: 8px;
}
#answerInput {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #bbb;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}
#send {
    border: none;
    background: #18232d;
    color: white;
    border-radius: 9px;
    padding: 0 17px;
    font-weight: bold;
}
#closeBox {
    display: block;
    margin-top: 10px;
    border: none;
    background: transparent;
    color: #555;
}
/* BUTTONS */
.controls {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 10000;
}
.control {
    width: 62px;
    height: 55px;
    border: 2px solid #18232d;
    border-radius: 15px;
    background: white;
    font-size: 25px;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,.3);
}
.control:active {
    transform: scale(.9);
}
/* MOBILE */
@media(max-width:700px) {
    .sara {
        transform: translateX(-50%) scale(.72);
        transform-origin: bottom center;
    }
    .control {
        width: 58px;
        height: 52px;
    }
}
</style>
</head>
<body>
<header>
<div class="logo">
    ClueMD
</div>
<a href="case001.html" class="back">
    ← Case 001
</a>
</header>
<div class="room">
<div class="patient">
    <strong>Sara</strong>
    <small>17 years old · Case 001</small>
</div>
<!-- SARA -->
<div class="sara">
    <div class="hair"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face">
        <div class="brow left"></div>
        <div class="brow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!-- SARA SPEAKING -->
<div class="speech">
    <span class="speech-name">
        SARA
    </span>
    <span id="speechText">
        I'm really worried... I don't feel well.
    </span>
</div>
<div class="desk"></div>
</div>
<!-- INPUT BOX -->
<div id="inputBox">
<div id="inputTitle">
    Ask Sara a question
</div>
<div class="inputRow">
    <input
        id="answerInput"
        type="text"
        placeholder="Type your question..."
    >
    <button
        id="send"
        type="button"
        onclick="sendAnswer()"
    >
        Send
    </button>
</div>
<button
    id="closeBox"
    type="button"
    onclick="closeBox()"
>
    Close
</button>
</div>
<!-- TWO BUTTONS ONLY -->
<div class="controls">
<button
    class="control"
    type="button"
    onclick="openKeyboard()"
>
    ⌨️
</button>
<button
    class="control"
    type="button"
    onclick="openDiagnosis()"
>
    🔎
</button>
</div>
<script>
/* CURRENT MODE */
var mode = "question";
/* ELEMENTS */
var inputBox =
    document.getElementById("inputBox");
var inputTitle =
    document.getElementById("inputTitle");
var answerInput =
    document.getElementById("answerInput");
var speechText =
    document.getElementById("speechText");
/* =========================
   OPEN KEYBOARD
========================= */
function openKeyboard() {
    mode = "question";
    inputTitle.innerText =
        "Ask Sara a question";
    answerInput.placeholder =
        "Type your question...";
    answerInput.value = "";
    inputBox.classList.add("open");
    setTimeout(function() {
        answerInput.focus();
    }, 100);
}
/* =========================
   OPEN DIAGNOSIS
========================= */
function openDiagnosis() {
    mode = "diagnosis";
    inputTitle.innerText =
        "What do you think Sara has?";
    answerInput.placeholder =
        "Enter your diagnosis...";
    answerInput.value = "";
    inputBox.classList.add("open");
    setTimeout(function() {
        answerInput.focus();
    }, 100);
}
/* =========================
   CLOSE
========================= */
function closeBox() {
    inputBox.classList.remove("open");
}
/* =========================
   SEND
========================= */
function sendAnswer() {
    var text =
        answerInput.value.trim();
    if (text === "") {
        return;
    }
    /* DIAGNOSIS */
    if (mode === "diagnosis") {
        speechText.innerText =
            "You think I have " +
            text +
            ".";
        closeBox();
        answerInput.value = "";
        return;
    }
    /* QUESTION */
    var q =
        text.toLowerCase();
    var answer;
    if (
        q.includes("where") ||
        q.includes("location") ||
        q.includes("side")
    ) {
        answer =
            "It hurts mostly on the lower right side of my stomach.";
    }
    else if (
        q.includes("when") ||
        q.includes("started") ||
        q.includes("began")
    ) {
        answer =
            "It started yesterday. It has been getting worse.";
    }
    else if (
        q.includes("pain") ||
        q.includes("hurt") ||
        q.includes("bad") ||
        q.includes("severity")
    ) {
        answer =
            "It's pretty painful... maybe a 7 out of 10.";
    }
    else if (
        q.includes("nausea") ||
        q.includes("nauseous")
    ) {
        answer =
            "Yes... I've been feeling really nauseous.";
    }
    else if (
        q.includes("vomit") ||
        q.includes("vomiting")
    ) {
        answer =
            "No, I haven't vomited.";
    }
    else if (
        q.includes("fever") ||
        q.includes("temperature") ||
        q.includes("hot")
    ) {
        answer =
            "I felt hot last night, but I didn't check my temperature.";
    }
    else if (
        q.includes("eat") ||
        q.includes("appetite") ||
        q.includes("hungry")
    ) {
        answer =
            "I don't really feel like eating.";
    }
    else if (
        q.includes("move") ||
        q.includes("walking") ||
        q.includes("walk")
    ) {
        answer =
            "Moving around makes the pain worse.";
    }
    else if (
        q.includes("bowel") ||
        q.includes("stool") ||
        q.includes("poop")
    ) {
        answer =
            "I haven't noticed anything unusual with my bowel movements.";
    }
