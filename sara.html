<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    overflow: hidden;
}
header {
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #ddd;
    position: relative;
    z-index: 100;
}
.logo {
    font-size: 23px;
    font-weight: bold;
}
.back {
    color: #18232d;
    text-decoration: none;
    font-weight: bold;
}
.room {
    position: relative;
    width: 100%;
    height: calc(100vh - 58px);
    overflow: hidden;
    background: #f7f9fa;
}
.patient {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
    z-index: 20;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient small {
    color: #777;
}
/* SARA */
.sara {
    position: absolute;
    width: 270px;
    height: 430px;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    z-index: 5;
}
.hair {
    position: absolute;
    top: 0;
    left: 38px;
    width: 195px;
    height: 205px;
    background: #493028;
    border-radius: 50%;
}
.ear {
    position: absolute;
    top: 105px;
    width: 22px;
    height: 40px;
    background: #efbd99;
    border-radius: 50%;
}
.ear.left {
    left: 49px;
}
.ear.right {
    right: 49px;
}
.face {
    position: absolute;
    top: 38px;
    left: 57px;
    width: 157px;
    height: 180px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
.brow {
    position: absolute;
    top: 57px;
    width: 30px;
    height: 4px;
    background: #57382e;
    border-radius: 5px;
}
.brow.left {
    left: 28px;
    transform: rotate(14deg);
}
.brow.right {
    right: 28px;
    transform: rotate(-14deg);
}
.eye {
    position: absolute;
    top: 73px;
    width: 17px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 35px;
}
.eye.right {
    right: 35px;
}
.mouth {
    position: absolute;
    top: 132px;
    left: 50%;
    width: 40px;
    height: 18px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
.neck {
    position: absolute;
    top: 210px;
    left: 109px;
    width: 52px;
    height: 55px;
    background: #efbd99;
}
.body {
    position: absolute;
    top: 250px;
    left: 13px;
    width: 245px;
    height: 220px;
    background: #8da6b5;
    border-radius: 90px 90px 20px 20px;
}
/* SPEECH */
.speech {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 430px;
    background: white;
    padding: 18px;
    border-radius: 22px;
    box-shadow: 0 6px 22px rgba(0,0,0,.15);
    z-index: 30;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
#speechText {
    font-size: 16px;
    line-height: 1.45;
}
/* DESK */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 95px;
    background: #8b6a50;
    z-index: 40;
}
/* PANELS */
.panel {
    position: fixed;
    display: none;
    left: 50%;
    bottom: 85px;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: white;
    padding: 18px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.35);
    z-index: 9999;
}
#keyboard:target {
    display: block;
}
#diagnosis:target {
    display: block;
}
/* INPUT */
.panel-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 12px;
}
.input-row {
    display: flex;
    gap: 8px;
}
.input-row input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #bbb;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}
.submit {
    border: none;
    background: #18232d;
    color: white;
    border-radius: 9px;
    padding: 0 16px;
    font-weight: bold;
}
.close {
    display: inline-block;
    margin-top: 12px;
    text-decoration: none;
    color: #555;
    font-weight: bold;
}
#diagnosisResult {
    margin-top: 12px;
    font-weight: bold;
}
/* CONTROLS */
.controls {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 10000;
}
.control {
    width: 62px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #18232d;
    border-radius: 15px;
    background: white;
    font-size: 25px;
    text-decoration: none;
    color: black;
    box-shadow: 0 5px 18px rgba(0,0,0,.3);
}
/* MOBILE */
@media(max-width:700px) {
    .sara {
        transform: translateX(-50%) scale(.72);
        transform-origin: bottom center;
    }
    .control {
        width: 58px;
        height: 52px;
    }
}
</style>
</head>
<body>
<header>
<div class="logo">
    ClueMD
</div>
<a
    href="case001.html"
    class="back"
>
    ← Case 001
</a>
</header>
<div class="room">
<div class="patient">
    <strong>Sara</strong>
    <small>
        17 years old · Case 001
    </small>
</div>
<!-- SARA -->
<div class="sara">
    <div class="hair"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face">
        <div class="brow left"></div>
        <div class="brow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!-- SPEECH -->
<div class="speech">
    <span class="speech-name">
        SARA
    </span>
    <span id="speechText">
        I'm really worried... I don't feel well.
    </span>
</div>
<div class="desk"></div>
</div>
<!-- =========================
     KEYBOARD PANEL
========================= -->
<div
    id="keyboard"
    class="panel"
>
<div class="panel-title">
    Ask Sara a question
</div>
<div class="input-row">
    <input
        id="questionInput"
        type="text"
        placeholder="Type your question..."
    >
    <button
        class="submit"
        type="button"
        onclick="askSara()"
    >
        Send
    </button>
</div>
<a
    href="#"
    class="close"
>
    Close
</a>
</div>
<!-- =========================
     DIAGNOSIS PANEL
========================= -->
<div
    id="diagnosis"
    class="panel"
>
<div class="panel-title">
    What do you think Sara has?
</div>
<div class="input-row">
    <input
        id="diagnosisInput"
        type="text"
        placeholder="Enter your diagnosis..."
    >
    <button
        class="submit"
        type="button"
        onclick="submitDiagnosis()"
    >
        Submit
    </button>
</div>
<div id="diagnosisResult"></div>
<a
    href="#"
    class="close"
>
    Close
</a>
</div>
<!-- CONTROLS -->
<div class="controls">
<a
    href="#keyboard"
    class="control"
>
    ⌨️
</a>
<a
    href="#diagnosis"
    class="control"
>
    🔎
</a>
</div>
<script>
/* =========================
   SARA ANSWERS
========================= */
function askSara() {
    var input =
        document.getElementById("questionInput");
    var question =
        input.value.toLowerCase().trim();
    var speech =
        document.getElementById("speechText");
    if (question === "") {
        return;
    }
    var answer;
    if (
        question.includes("where") ||
        question.includes("location") ||
        question.includes("side")
    ) {
        answer =
        "It hurts mostly on the lower right side of my stomach.";
    }
    else if (
        question.includes("when") ||
        question.includes("started") ||
        question.includes("began")
    ) {
        answer =
        "It started yesterday. It has been getting worse.";
    }
    else if (
        question.includes("pain") ||
        question.includes("hurt") ||
        question.includes("bad") ||
        question.includes("severity")
    ) {
        answer =
        "It's pretty painful... maybe a 7 out of 10.";
    }
    else if (
        question.includes("nausea") ||
        question.includes("nauseous")
    ) {
        answer =
        "Yes... I've been feeling really nauseous.";
    }
    else if (
        question.includes("vomit") ||
        question.includes("vomiting")
    ) {
        answer =
        "No, I haven't vomited.";
    }
    else if (
        question.includes("fever") ||
        question.includes("temperature") ||
        question.includes("hot")
    ) {
        answer =
        "I felt hot last night, but I didn't check my temperature.";
    }
    else if (
        question.includes("appetite") ||
        question.includes("hungry") ||
        question.includes("eat")
    ) {
        answer =
        "I don't really feel like eating.";
    }
    else if (
        question.includes("move") ||
        question.includes("walking") ||
        question.includes("walk")
    ) {
        answer =
        "Moving around makes the pain worse.";
    }
    else if (
        question.includes("bowel") ||
        question.includes("stool") ||
        question.includes("poop")
    ) {
        answer =
        "I haven't noticed anything unusual with my bowel movements.";
    }
    else if (
        question.includes("urine") ||
        question.includes("pee") ||
        question.includes("urinate")
    ) {
        answer =
        "No, I don't have any problems when I pee.";
    }
    else if (
        question.includes("period") ||
        question.includes("menstrual")
    ) {
        answer =
        "My last period was about two weeks ago.";
    }
    else if (
        question.includes("surgery") ||
        question.includes("operation")
    ) {
        answer =
        "I've never had surgery before.";
    }
