<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    color: #18232d;
    overflow: hidden;
}
/* HEADER */
header {
    height: 60px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
    border-bottom: 1px solid #ddd;
    position: relative;
    z-index: 100;
}
.logo {
    font-size: 23px;
    font-weight: 800;
}
.back {
    color: #18232d;
    text-decoration: none;
    font-weight: bold;
}
/* CLINIC */
.clinic {
    position: relative;
    height: calc(100vh - 60px);
    overflow: hidden;
    background: #f7f9fa;
}
/* PATIENT LABEL */
.patient {
    position: absolute;
    top: 18px;
    left: 18px;
    background: white;
    padding: 11px 16px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    z-index: 40;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient span {
    color: #777;
    font-size: 12px;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    width: 300px;
    height: 500px;
    left: 50%;
    bottom: 130px;
    transform: translateX(-50%);
    z-index: 5;
}
/* HAIR */
.hair {
    position: absolute;
    top: 10px;
    left: 48px;
    width: 205px;
    height: 225px;
    background: #493028;
    border-radius: 50%;
}
/* EARS */
.ear {
    position: absolute;
    top: 110px;
    width: 24px;
    height: 43px;
    background: #efbd99;
    border-radius: 50%;
    z-index: 1;
}
.ear.left {
    left: 60px;
}
.ear.right {
    right: 60px;
}
/* FACE */
.face {
    position: absolute;
    top: 45px;
    left: 68px;
    width: 165px;
    height: 190px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* SAD EYEBROWS */
.eyebrow {
    position: absolute;
    top: 60px;
    width: 31px;
    height: 4px;
    background: #5b3930;
    border-radius: 5px;
}
.eyebrow.left {
    left: 30px;
    transform: rotate(14deg);
}
.eyebrow.right {
    right: 30px;
    transform: rotate(-14deg);
}
/* EYES */
.eye {
    position: absolute;
    top: 76px;
    width: 18px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 37px;
}
.eye.right {
    right: 37px;
}
/* SAD MOUTH */
.mouth {
    position: absolute;
    top: 134px;
    left: 50%;
    width: 42px;
    height: 20px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
/* NECK */
.neck {
    position: absolute;
    top: 225px;
    left: 123px;
    width: 55px;
    height: 55px;
    background: #efbd99;
}
/* BODY */
.body {
    position: absolute;
    top: 260px;
    left: 27px;
    width: 245px;
    height: 250px;
    background: #8da6b5;
    border-radius: 90px 90px 25px 25px;
}
/* =========================
   SPEECH
========================= */
.speech {
    position: absolute;
    z-index: 50;
    left: calc(50% + 115px);
    bottom: 350px;
    width: 340px;
    background: white;
    padding: 19px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    font-size: 16px;
    line-height: 1.45;
}
.speech::before {
    content: "";
    position: absolute;
    left: -18px;
    bottom: 30px;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    border-right: 20px solid white;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
/* =========================
   DESK
========================= */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 150px;
    background: #8b6a50;
    z-index: 10;
    box-shadow: 0 -5px 15px rgba(0,0,0,.12);
}
/* =========================
   CONTROLS
========================= */
.controls {
    position: absolute;
    z-index: 100;
    bottom: 55px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 15px;
}
.control {
    width: 62px;
    height: 56px;
    border: none;
    border-radius: 15px;
    background: white;
    box-shadow: 0 5px 18px rgba(0,0,0,.25);
    font-size: 24px;
    cursor: pointer;
}
.control:active {
    transform: scale(.94);
}
/* =========================
   QUESTION BOX
========================= */
.question-area {
    display: none;
    position: absolute;
    z-index: 200;
    bottom: 120px;
    left: 50%;
    transform: translateX(-50%);
    width: min(650px, 90%);
    background: white;
    padding: 10px;
    border-radius: 14px;
    box-shadow: 0 7px 25px rgba(0,0,0,.2);
}
.question-area.open {
    display: flex;
}
.question-area input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 12px;
}
/* MOBILE */
@media(max-width:700px) {
    .sara {
        transform:
            translateX(-50%)
            scale(.68);
        transform-origin:
            bottom center;
        bottom: 125px;
    }
    .speech {
        left: 50%;
        bottom: 365px;
        transform: translateX(-50%);
        width: 82%;
        font-size: 15px;
    }
    .speech::before {
        display: none;
    }
    .controls {
        bottom: 55px;
    }
}
/* BLINK */
.sara.blink .eye {
    height: 2px;
}
</style>
</head>
