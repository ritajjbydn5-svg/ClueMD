<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    overflow: hidden;
}
/* =========================
   HEADER
========================= */
header {
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #ddd;
    position: relative;
    z-index: 100;
}
.logo {
    font-size: 23px;
    font-weight: bold;
}
.back {
    text-decoration: none;
    color: #18232d;
    font-weight: bold;
}
/* =========================
   ROOM
========================= */
.room {
    position: relative;
    height: calc(100vh - 58px);
    overflow: hidden;
    background: #f7f9fa;
}
/* =========================
   PATIENT LABEL
========================= */
.patient {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.12);
    z-index: 20;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient small {
    color: #777;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    width: 270px;
    height: 430px;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    z-index: 5;
}
/* HAIR */
.hair {
    position: absolute;
    top: 0;
    left: 38px;
    width: 195px;
    height: 205px;
    background: #493028;
    border-radius: 50%;
}
/* EARS */
.ear {
    position: absolute;
    top: 105px;
    width: 22px;
    height: 40px;
    background: #efbd99;
    border-radius: 50%;
}
.ear.left {
    left: 49px;
}
.ear.right {
    right: 49px;
}
/* FACE */
.face {
    position: absolute;
    top: 38px;
    left: 57px;
    width: 157px;
    height: 180px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* WORRIED EYEBROWS */
.brow {
    position: absolute;
    top: 57px;
    width: 30px;
    height: 4px;
    background: #57382e;
    border-radius: 5px;
}
.brow.left {
    left: 28px;
    transform: rotate(14deg);
}
.brow.right {
    right: 28px;
    transform: rotate(-14deg);
}
/* EYES */
.eye {
    position: absolute;
    top: 73px;
    width: 17px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 35px;
}
.eye.right {
    right: 35px;
}
/* SAD MOUTH */
.mouth {
    position: absolute;
    top: 132px;
    left: 50%;
    width: 40px;
    height: 18px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
/* NECK */
.neck {
    position: absolute;
    top: 210px;
    left: 109px;
    width: 52px;
    height: 55px;
    background: #efbd99;
}
/* BODY */
.body {
    position: absolute;
    top: 250px;
    left: 13px;
    width: 245px;
    height: 220px;
    background: #8da6b5;
    border-radius: 90px 90px 20px 20px;
}
/* =========================
   SPEECH CLOUD
========================= */
.speech {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 430px;
    background: white;
    padding: 18px;
    border-radius: 22px;
    box-shadow: 0 6px 22px rgba(0,0,0,.15);
    z-index: 30;
}
.speech:after {
    content: "";
    position: absolute;
    bottom: -14px;
    left: 50%;
    border-left: 12px solid transparent;
    border-right: 12px solid transparent;
    border-top: 15px solid white;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
#speechText {
    font-size: 16px;
    line-height: 1.45;
}
/* =========================
   DESK
========================= */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 95px;
    background: #8b6a50;
    z-index: 40;
}
/* =========================
   QUESTION BOX
========================= */
#questionBox {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 88px;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: white;
    padding: 16px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
    z-index: 1000;
}
#questionBox.show {
    display: block;
}
#boxTitle {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}
.inputRow {
    display: flex;
    gap: 8px;
}
#questionInput {
    flex: 1;
    min-width: 0;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}
#sendButton {
    border: none;
    border-radius: 9px;
    background: #18232d;
    color: white;
    padding: 0 16px;
    font-weight: bold;
}
/* =========================
   BOTTOM CONTROLS
========================= */
.controls {
    position: fixed;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 2000;
}
.control {
    width: 60px;
    height: 55px;
    border: 2px solid #18232d;
    border-radius: 15px;
    background: white;
    font-size: 24px;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,.3);
}
.control:active {
    transform: scale(.9);
}
/* =========================
   MOBILE
========================= */
@media(max-width:700px) {
    .sara {
        transform:
            translateX(-50%)
            scale(.72);
        transform-origin: bottom center;
    }
    .control {
        width: 58px;
        height: 52px;
    }
}
</style>
</head>
<body>
<header>
<div class="logo">
    ClueMD
</div>
<a
    class="back"
    href="case001.html"
>
    ← Case 001
</a>
</header>
<div class="room">
<!-- PATIENT -->
<div class="patient">
    <strong>Sara</strong>
    <small>
        17 years old · Case 001
    </small>
</div>
<!-- SARA -->
<div class="sara">
    <div class="hair"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face">
        <div class="brow left"></div>
        <div class="brow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!-- SARA'S SPEECH -->
<div class="speech">
    <span class="speech-name">
        SARA
    </span>
    <span id="speechText">
        I'm really worried... I don't feel well.
    </span>
</div>
<div class="desk"></div>
</div>
<!-- =========================
     QUESTION / DIAGNOSIS BOX
========================= -->
<div id="questionBox">
<span id="boxTitle">
    Ask Sara a question
</span>
<div class="inputRow">
    <input
        id="questionInput"
        type="text"
        placeholder="Type your question..."
        autocomplete="off"
    >
    <button
        id="sendButton"
        type="button"
        onclick="sendQuestion()"
    >
        Send
    </button>
</div>
</div>
<!-- =========================
     BUTTONS
========================= -->
<div class="controls">
<!-- KEYBOARD -->
<button
    class="control"
    type="button"
    onclick="openKeyboard()"
>
    ⌨️
</button>
<!-- DIAGNOSIS -->
<button
    class="control"
    type="button"
    onclick="openDiagnosis()"
>
    🔎
</button>
</div>
<script>
/* =========================
   VARIABLES
========================= */
var mode = "question";
var questionBox =
    document.getElementById("questionBox");
var boxTitle =
    document.getElementById("boxTitle");
var questionInput =
    document.getElementById("questionInput");
var speechText =
    document.getElementById("speechText");
/* =========================
   KEYBOARD
========================= */
function openKeyboard() {
    mode = "question";
    boxTitle.innerHTML =
        "Ask Sara a question";
    questionInput.placeholder =
        "Type your question...";
    questionInput.value = "";
    questionBox.classList.add("show");
    setTimeout(function() {
        questionInput.focus();
    }, 100);
}
/* =========================
   DIAGNOSIS
========================= */
function openDiagnosis() {
    mode = "diagnosis";
    boxTitle.innerHTML =
        "What do you think Sara has?";
    questionInput.placeholder =
        "Enter your diagnosis...";
    questionInput.value = "";
    questionBox.classList.add("show");
    setTimeout(function() {
        questionInput.focus();
    }, 100);
}

   SEND
========================= */
function sendQuestion() {
    var question =
        questionInput.value.trim();
    if (question === "") {
        return;
    }

       DIAGNOSIS
    ===================== */
    if (mode === "diagnosis") {
        speechText.innerHTML =
            "You think I have <strong>"
            +
            question
            +
            "</strong>.";

        return;
