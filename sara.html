<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #f5f7f8;
    color: #18232d;
}
/* =========================
   HEADER
========================= */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    border-bottom: 1px solid #ddd;
    z-index: 500;
}
.logo {
    font-size: 23px;
    font-weight: bold;
}
.back {
    color: #18232d;
    text-decoration: none;
    font-weight: bold;
}
/* =========================
   CLINIC
========================= */
.clinic {
    position: fixed;
    top: 58px;
    left: 0;
    width: 100%;
    height: calc(100% - 58px);
    overflow: hidden;
    background: #f7f9fa;
}
/* =========================
   PATIENT LABEL
========================= */
.patient {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    z-index: 100;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient span {
    font-size: 11px;
    color: #777;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    width: 290px;
    height: 480px;
    left: 50%;
    bottom: 145px;
    transform: translateX(-50%);
    z-index: 10;
}
/* HAIR */
.hair {
    position: absolute;
    top: 5px;
    left: 43px;
    width: 205px;
    height: 220px;
    background: #493028;
    border-radius: 50%;
}
/* EARS */
.ear {
    position: absolute;
    top: 108px;
    width: 23px;
    height: 42px;
    background: #efbd99;
    border-radius: 50%;
    z-index: 1;
}
.ear.left {
    left: 55px;
}
.ear.right {
    right: 55px;
}
/* FACE */
.face {
    position: absolute;
    top: 42px;
    left: 63px;
    width: 165px;
    height: 190px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* SAD EYEBROWS */
.eyebrow {
    position: absolute;
    top: 59px;
    width: 31px;
    height: 4px;
    background: #5b3930;
    border-radius: 5px;
}
.eyebrow.left {
    left: 30px;
    transform: rotate(14deg);
}
.eyebrow.right {
    right: 30px;
    transform: rotate(-14deg);
}
/* EYES */
.eye {
    position: absolute;
    top: 75px;
    width: 18px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 37px;
}
.eye.right {
    right: 37px;
}
/* SAD MOUTH */
.mouth {
    position: absolute;
    top: 133px;
    left: 50%;
    width: 42px;
    height: 20px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
/* NECK */
.neck {
    position: absolute;
    top: 220px;
    left: 118px;
    width: 55px;
    height: 55px;
    background: #efbd99;
}
/* BODY */
.body {
    position: absolute;
    top: 255px;
    left: 23px;
    width: 245px;
    height: 250px;
    background: #8da6b5;
    border-radius: 90px 90px 25px 25px;
}
/* =========================
   SPEECH BUBBLE
========================= */
.speech {
    position: absolute;
    z-index: 200;
    left: calc(50% + 105px);
    top: 130px;
    width: 330px;
    background: white;
    padding: 18px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    font-size: 16px;
    line-height: 1.45;
}
.speech::before {
    content: "";
    position: absolute;
    left: -18px;
    bottom: 30px;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    border-right: 20px solid white;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
/* =========================
   DESK
========================= */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 115px;
    background: #8b6a50;
    z-index: 50;
}
/* =========================
   QUESTION BOX
========================= */
.question-area {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 82px;
    transform: translateX(-50%);
    width: min(650px, 88%);
    background: white;
    padding: 9px;
    border-radius: 14px;
    box-shadow: 0 7px 25px rgba(0,0,0,.25);
    z-index: 600;
}
.question-area.open {
    display: block;
}
.question-area input {
    width: 100%;
    border: none;
    outline: none;
    padding: 13px;
    font-size: 16px;
}
/* =========================
   IMPORTANT:
   FIXED BUTTONS
========================= */
.controls {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 1000;
}
.control {
    width: 60px;
    height: 55px;
    border: none;
    border-radius: 15px;
    background: white;
    box-shadow:
        0 5px 20px rgba(0,0,0,.30);
    font-size: 24px;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}
.control:active {
    transform: scale(.92);
}
/* =========================
   MOBILE
========================= */
@media(max-width:700px) {
    .sara {
        width: 270px;
        height: 440px;
        bottom: 120px;
        transform:
            translateX(-50%)
            scale(.72);
        transform-origin:
            bottom center;
    }
    .speech {
        top: 105px;
        left: 50%;
        transform: translateX(-50%);
        width: 84%;
        font-size: 14px;
    }
    .speech::before {
        display: none;
    }
    .patient {
        top: 12px;
        left: 12px;
    }
    .controls {
        bottom: 18px;
        gap: 12px;
    }
    .control {
        width: 58px;
        height: 52px;
        font-size: 22px;
    }
}
/* =========================
   BLINK
========================= */
.sara.blink .eye {
    height: 2px;
}
</style>
</head>

<div class="logo">

<div class="clinic">

<!-- SARA SPEAKING -->
<div

<div

</div>
<!-- =========================

========================= -->
<div class="controls">

    aria-label="Keyboard"
>
    ⌨️
</button>
<button

    onclick="startMicrophone()"

>
    🎙️
</button>
<button
    class="control"
    type="button"
    onclick="askSara()"

>
    🔎
</button>
</div>
