<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
/* =========================
   BASIC PAGE
========================= */
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    color: #18232d;
    overflow: hidden;
}
/* =========================
   HEADER
========================= */
header {
    height: 64px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid #ddd;
    position: relative;
    z-index: 100;
}
.logo {
    font-size: 24px;
    font-weight: 800;
}
.back {
    text-decoration: none;
    color: #18232d;
    font-weight: bold;
}
/* =========================
   CLINIC
========================= */
.clinic {
    position: relative;
    height: calc(100vh - 64px);
    background: #f7f9fa;
    overflow: hidden;
}
/* =========================
   PATIENT LABEL
========================= */
.patient {
    position: absolute;
    top: 20px;
    left: 20px;
    background: white;
    padding: 12px 17px;
    border-radius: 12px;
    box-shadow:
        0 4px 15px rgba(0,0,0,.08);
    z-index: 30;
}
.patient strong {
    display: block;
    font-size: 18px;
    margin-bottom: 3px;
}
.patient span {
    font-size: 12px;
    color: #777;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    width: 310px;
    height: 530px;
    left: 50%;
    bottom: 70px;
    transform: translateX(-50%);
    z-index: 5;
}
/* HAIR */
.hair {
    position: absolute;
    top: 15px;
    left: 52px;
    width: 205px;
    height: 230px;
    background: #493028;
    border-radius: 50%;
}
/* EARS */
.ear {
    position: absolute;
    top: 115px;
    width: 25px;
    height: 45px;
    background: #efbd99;
    border-radius: 50%;
    z-index: 1;
}
.ear.left {
    left: 64px;
}
.ear.right {
    right: 64px;
}
/* FACE */
.face {
    position: absolute;
    top: 48px;
    left: 72px;
    width: 165px;
    height: 190px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* =========================
   SAD FACE
========================= */
/* EYEBROWS */
.eyebrow {
    position: absolute;
    top: 61px;
    width: 31px;
    height: 4px;
    background: #5b3930;
    border-radius: 5px;
}
.eyebrow.left {
    left: 30px;
    transform: rotate(14deg);
}
.eyebrow.right {
    right: 30px;
    transform: rotate(-14deg);
}
/* EYES */
.eye {
    position: absolute;
    top: 76px;
    width: 18px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
    transition: .15s;
}
.eye.left {
    left: 37px;
}
.eye.right {
    right: 37px;
}
/* SAD MOUTH */
.mouth {
    position: absolute;
    top: 133px;
    left: 50%;
    width: 42px;
    height: 20px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
/* =========================
   BLINK
========================= */
.sara.blink .eye {
    height: 2px;
}
/* =========================
   NECK
========================= */
.neck {
    position: absolute;
    top: 225px;
    left: 128px;
    width: 55px;
    height: 55px;
    background: #efbd99;
}
/* =========================
   BODY
========================= */
.body {
    position: absolute;
    top: 260px;
    left: 32px;
    width: 245px;
    height: 270px;
    background: #8da6b5;
    border-radius: 90px 90px 25px 25px;
}
/* =========================
   SPEECH BUBBLE
========================= */
.speech {
    position: absolute;
    z-index: 40;
    left: calc(50% + 120px);
    bottom: 350px;
    width: 350px;
    background: white;
    padding: 20px;
    border-radius: 22px;
    box-shadow:
        0 8px 30px rgba(0,0,0,.12);
    font-size: 17px;
    line-height: 1.45;
    transition: .25s;
}
/* SPEECH TAIL */
.speech::before {
    content: "";
    position: absolute;
    left: -18px;
    bottom: 30px;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    border-right: 20px solid white;
}
/* NAME */
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
    letter-spacing: .7px;
}
/* =========================
   DESK
========================= */
.desk {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 105px;
    background: #8b6a50;
    z-index: 10;
    box-shadow:
        0 -5px 15px rgba(0,0,0,.10);
}
/* =========================
   CONTROLS
========================= */
.controls {
    position: absolute;
    z-index: 100;
    bottom: 125px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    align-items: center;
}
.control {
    width: 60px;
    height: 55px;
    border: none;
    border-radius: 15px;
    background: white;
    box-shadow:
        0 5px 20px rgba(0,0,0,.20);
    font-size: 24px;
    cursor: pointer;
    transition: .2s;
}
.control:hover {
    transform: translateY(-3px);
}
/* =========================
   QUESTION AREA
========================= */
.question-area {
    display: none;
    position: absolute;
    z-index: 200;
    bottom: 190px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, 90%);
    background: white;
    padding: 10px;
    border-radius: 15px;
    box-shadow:
        0 7px 25px rgba(0,0,0,.18);
}
.question-area.open {
    display: flex;
    gap: 8px;
}
.question-area input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 12px;
}
.question-area button {
    border: none;
    border-radius: 10px;
    background: #18232d;
    color: white;
    padding: 0 16px;
    font-weight: bold;
}
/* =========================
   MOBILE
========================= */
@media(max-width:700px) {
    .speech {
        left: 50%;
        bottom: 370px;
        transform: translateX(-50%);
        width: 82%;
        font-size: 15px;
    }
    .speech::before {
        display: none;
    }
    .sara {
        transform:
            translateX(-50%)
            scale(.70);
        transform-origin:
            bottom center;
    }
    .controls {
        bottom: 120px;
    }
}
/* =========================
   TALKING
========================= */
@keyframes talking {
    0% {
        transform:
            translateX(-50%)
            translateY(0);
    }
    50% {
        transform:
            translateX(-50%)
            translateY(-3px);
    }
    100% {
        transform:
            translateX(-50%)
            translateY(0);
    }
}
.sara.talking {
    animation:
        talking .45s ease-in-out;
}
</style>
</head>
<body>
<!-- =========================
     HEADER
========================= -->
<header>
<div class="logo">
    ClueMD
</div>
<a
    href="case001.html"
    class="back"
>
    ← Case 001
</a>
</header>
<!-- =========================
     CLINIC
========================= -->
<div class="clinic">
<!-- PATIENT LABEL -->
<div class="patient">
    <strong>
        Sara
    </strong>
    <span>
        17 years old · Case 001
    </span>
</div>
<!-- =====================
     SARA
====================== -->
<div
    class="sara"
    id="sara"
>
    <div class="hair"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face">
        <div class="eyebrow left"></div>
        <div class="eyebrow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!-- =====================
     SARA SPEECH
====================== -->
<div
    class="speech"
    id="speech"
>
    <span class="speech-name">
        SARA
    </span>
    Hi... I'm Sara. I've been having this really bad pain since yesterday. It has been getting worse, and I'm starting to feel scared.
</div>
<!-- =====================
     QUESTION AREA
====================== -->
<div
    class="question-area"
    id="questionArea"
>
    <input
        id="questionInput"
        type="text"
        placeholder="Ask Sara a question..."
        autocomplete="off"
    >
</div>
<!-- =====================
     DESK
====================== -->
<div class="desk"></div>
<!-- =====================
     THREE CONTROLS
====================== -->
<div class="controls">
    <!-- KEYBOARD -->
    <button
        type="button"
        class="control"
        onclick="openKeyboard()"
        aria-label="Keyboard"
    >
        ⌨️
    </button>
    <!-- MICROPHONE -->
    <button
        type="button"
        class="control"
        onclick="startMicrophone()"
        aria-label="Microphone"
    >
        🎙️
    </button>
    <!-- INVESTIGATE / ASK -->
    <button
        type="button"
        class="control"
        onclick="askSara()"
        aria-label="Ask Sara"
    >
        🔎
    </button>
</div>
</div>
<script>
/* =========================
   ELEMENTS
========================= */

    document.getElementById("sara");
const speech =
    document.getElementById("speech");
const questionArea =
    document.getElementById("questionArea");
const questionInput =
    document.getElementById("questionInput");

   OPEN KEYBOARD
========================= */
function openKeyboard() {
    questionArea.classList.add("open");
    questionInput.focus();
}
