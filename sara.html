<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara - ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
html,
body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #eef2f4;
}
/* =========================
   HEADER
========================= */
header {
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #dddddd;
    position: relative;
    z-index: 100;
}
.logo {
    font-size: 23px;
    font-weight: bold;
}
.back {
    color: #18232d;
    text-decoration: none;
    font-weight: bold;
}
/* =========================
   ROOM
========================= */
.room {
    position: relative;
    width: 100%;
    height: calc(100vh - 58px);
    overflow: hidden;
    background: #f7f9fa;
}
/* =========================
   PATIENT LABEL
========================= */
.patient {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
    z-index: 20;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient small {
    color: #777777;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    width: 270px;
    height: 430px;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    z-index: 5;
}
/* Hair */
.hair {
    position: absolute;
    top: 0;
    left: 38px;
    width: 195px;
    height: 205px;
    background: #493028;
    border-radius: 50%;
}
/* Ears */
.ear {
    position: absolute;
    top: 105px;
    width: 22px;
    height: 40px;
    background: #efbd99;
    border-radius: 50%;
}
.ear.left {
    left: 49px;
}
.ear.right {
    right: 49px;
}
/* Face */
.face {
    position: absolute;
    top: 38px;
    left: 57px;
    width: 157px;
    height: 180px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* Worried eyebrows */
.brow {
    position: absolute;
    top: 57px;
    width: 30px;
    height: 4px;
    background: #57382e;
    border-radius: 5px;
}
.brow.left {
    left: 28px;
    transform: rotate(14deg);
}
.brow.right {
    right: 28px;
    transform: rotate(-14deg);
}
/* Eyes */
.eye {
    position: absolute;
    top: 73px;
    width: 17px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 35px;
}
.eye.right {
    right: 35px;
}
/* Sad mouth */
.mouth {
    position: absolute;
    top: 132px;
    left: 50%;
    width: 40px;
    height: 18px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
/* Neck */
.neck {
    position: absolute;
    top: 210px;
    left: 109px;
    width: 52px;
    height: 55px;
    background: #efbd99;
}
/* Body */
.body {
    position: absolute;
    top: 250px;
    left: 13px;
    width: 245px;
    height: 220px;
    background: #8da6b5;
    border-radius: 90px 90px 20px 20px;
}
/* =========================
   SPEECH CLOUD
========================= */
.speech {
    position: absolute;
    top: 85px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 430px;
    background: white;
    padding: 18px;
    border-radius: 22px;
    box-shadow: 0 6px 22px rgba(0,0,0,0.15);
    z-index: 30;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777777;
    margin-bottom: 7px;
}
#speechText {
    font-size: 16px;
    line-height: 1.45;
}
/* =========================
   DESK
========================= */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 95px;
    background: #8b6a50;
    z-index: 40;
}
/* =========================
   POPUPS
========================= */
.popup {
    position: fixed;
    display: none;
    left: 50%;
    bottom: 85px;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: white;
    padding: 18px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.35);
    z-index: 99999;
}
/*
   The keyboard and diagnosis boxes
   open using the URL hash.
*/
#keyboard:target {
    display: block;
}
#diagnosis:target {
    display: block;
}
/* =========================
   POPUP CONTENT
========================= */
.popup-title {
    font-size: 17px;
    font-weight: bold;
    margin-bottom: 12px;
}
.input-row {
    display: flex;
    gap: 8px;
    width: 100%;
}
.input-row input {
    flex: 1;
    min-width: 0;
    padding: 13px;
    border: 1px solid #bbbbbb;
    border-radius: 9px;
    font-size: 16px;
    outline: none;
}
.send-button {
    flex-shrink: 0;
    border: none;
    background: #18232d;
    color: white;
    border-radius: 9px;
    padding: 0 17px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
}
.send-button:active {
    transform: scale(0.95);
}
/* Close */
.close {
    display: inline-block;
    margin-top: 12px;
    color: #555555;
    text-decoration: none;
    font-size: 14px;
    font-weight: bold;
}
/* Diagnosis result */
#diagnosisResult {
    margin-top: 12px;
    font-weight: bold;
    line-height: 1.4;
}
/* =========================
   BOTTOM BUTTONS
========================= */
.controls {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 100000;
}
.control {
    width: 62px;
    height: 55px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 2px solid #18232d;
    border-radius: 15px;
    background: white;
    color: black;
    text-decoration: none;
    font-size: 25px;
    box-shadow: 0 5px 18px rgba(0,0,0,0.3);
    -webkit-tap-highlight-color: transparent;
}
.control:active {
    transform: scale(0.92);
}
/* =========================
   IPAD / PHONE
========================= */
@media (max-width: 700px) {
    .sara {
        transform: translateX(-50%) scale(0.72);
        transform-origin: bottom center;
    }
    .control {
        width: 58px;
        height: 52px;
    }
}
</style>
</head>
<body>
<!-- =========================
     HEADER
========================= -->
<header>
<div class="logo">
    ClueMD
</div>
<a
    href="case001.html"
    class="back"
>
    ← Case 001
</a>
</header>
<!-- =========================
     ROOM
========================= -->
<div class="room">
<!-- PATIENT LABEL -->
<div class="patient">
    <strong>
        Sara
    </strong>
    <small>
        17 years old · Case 001
    </small>
</div>
<!-- =========================
     SARA
========================= -->
<div class="sara">
    <div class="hair"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face">
        <div class="brow left"></div>
        <div class="brow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!-- =========================
     SARA'S SPEECH
========================= -->
<div class="speech">
    <span class="speech-name">
        SARA
    </span>
    <span id="speechText">
        I'm really worried... I don't feel well.
    </span>
</div>
<!-- DESK -->
<div class="desk"></div>
</div>
<!-- ==================================================
     KEYBOARD / ASK SARA
================================================== -->
<div
    id="keyboard"
    class="popup"
>
<div class="popup-title">
    Ask Sara a question
</div>
<div class="input-row">
    <input
        id="questionInput"
        type="text"
        autocomplete="off"
        placeholder="Type your question..."
    >
    <!--
         IMPORTANT:
         Send directly calls askSara().
         No event listener is needed.
    -->
    <button
        type="button"
        class="send-button"
        onclick="askSara()"
    >
        Send
    </button>
</div>
<a
    href="#"
    class="close"
>
    Close
</a>
</div>
<!-- ==================================================
     DIAGNOSIS
================================================== -->
<div
    id="diagnosis"
    class="popup"
>
<div class="popup-title">
    What do you think Sara has?
</div>
<div class="input-row">
    <input
        id="diagnosisInput"
        type="text"
        autocomplete="off"
        placeholder="Enter your diagnosis..."
    >
    <button
        type="button"
        class="send-button"
        onclick="submitDiagnosis()"
    >
        Submit
    </button>
</div>
<div id="diagnosisResult"></div>
<a
    href="#"
    class="close"
>
    Close
</a>
</div>
<!-- ==================================================
     BOTTOM BUTTONS
================================================== -->
<div class="controls">
<!--
     NORMAL HTML LINK.
     THIS DOES NOT DEPEND ON JAVASCRIPT.
-->
<a
    href="#keyboard"
    class="control"
    aria-label="Ask Sara"
>
    ⌨️
</a>
<!--
     NORMAL HTML LINK.
     THIS DOES NOT DEPEND ON JAVASCRIPT.
-->
<a
    href="#diagnosis"
    class="control"
    aria-label="Diagnosis"
>
    🔎
</a>
</div>
