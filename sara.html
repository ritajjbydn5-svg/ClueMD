<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sara | ClueMD</title>
<style>
/* =========================
   GENERAL
========================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  min-height: 100vh;
  font-family:
    Arial,
    Helvetica,
    sans-serif;
  background: #e8edf1;
  color: #17202a;
  overflow: hidden;
}
/* =========================
   HEADER
========================= */
header {
  height: 65px;
  background: white;
  border-bottom:
    1px solid #d9dfe3;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 5%;
  position: relative;
  z-index: 100;
}
.logo {
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 1px;
}
.back {
  color: #17202a;
  text-decoration: none;
  font-weight: 700;
}
/* =========================
   CLINIC
========================= */
.clinic {
  position: relative;
  height:
    calc(100vh - 65px);
  background: #f6f8f9;
  overflow: hidden;
}
/* =========================
   WINDOW
========================= */
.window {
  position: absolute;
  top: 45px;
  right: 8%;
  width: 190px;
  height: 135px;
  background: #dcecf5;
  border: 9px solid white;
  box-shadow:
    0 8px 25px
    rgba(0,0,0,0.06);
}
.window::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 3px;
  background: white;
}
.window::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 3px;
  background: white;
}
/* =========================
   PATIENT CARD
========================= */
.patient-card {
  position: absolute;
  top: 25px;
  left: 25px;
  background: white;
  padding: 14px 18px;
  border-radius: 12px;
  box-shadow:
    0 5px 20px
    rgba(0,0,0,0.08);
  z-index: 20;
}
.patient-card strong {
  display: block;
  font-size: 18px;
  margin-bottom: 4px;
}
.patient-card span {
  color: #6b7280;
  font-size: 12px;
}
/* =========================
   SARA
========================= */
.sara {
  position: absolute;
  width: 310px;
  height: 540px;
  left: 50%;
  bottom: 70px;
  transform:
    translateX(-50%);
  z-index: 5;
}
/* =========================
   HAIR
========================= */
.hair {
  position: absolute;
  top: 20px;
  left: 52px;
  width: 205px;
  height: 230px;
  background: #4a3028;
  border-radius:
    48% 48% 42% 42%;
  z-index: 1;
}
/* =========================
   EARS
========================= */
.ear {
  position: absolute;
  top: 115px;
  width: 25px;
  height: 45px;
  background: #efbd99;
  border-radius: 50%;
  z-index: 1;
}
.ear.left {
  left: 65px;
}
.ear.right {
  right: 65px;
}
/* =========================
   FACE
========================= */
.head {
  position: absolute;
  top: 48px;
  left: 72px;
  width: 165px;
  height: 190px;
  background: #f2c7a5;
  border-radius:
    48% 48% 45% 45%;
  z-index: 2;
}
/* =========================
   EYES
========================= */
.eye {
  position: absolute;
  top: 75px;
  width: 18px;
  height: 12px;
  background: #30241f;
  border-radius: 50%;
  transition:
    all 0.15s ease;
}
.eye.left {
  left: 38px;
}
.eye.right {
  right: 38px;
}
/* blinking */
.sara.blink .eye {
  height: 2px;
}
/* =========================
   MOUTH
========================= */
.mouth {
  position: absolute;
  left: 50%;
  top: 125px;
  width: 35px;
  height: 12px;
  border-bottom:
    3px solid #7c3f3f;
  border-radius:
    0 0 50% 50%;
  transform:
    translateX(-50%);
  transition:
    all 0.25s ease;
}
/* =========================
   AUTOMATIC EXPRESSIONS
========================= */
/* worried */
.sara.worried .mouth {
  border-bottom: none;
  border-top:
    3px solid #7c3f3f;
  border-radius:
    50% 50% 0 0;
}
/* pain */
.sara.pained .mouth {
  width: 28px;
  height: 20px;
  border:
    3px solid #7c3f3f;
  border-radius: 50%;
}
/* nausea */
.sara.nauseous .mouth {
  width: 30px;
  height: 8px;
  border-bottom:
    3px solid #7c3f3f;
  border-radius: 50%;
}
/* surprise */
.sara.surprised .mouth {
  width: 22px;
  height: 28px;
  border:
    3px solid #7c3f3f;
  border-radius: 50%;
}
/* happy */
.sara.happy .mouth {
  width: 40px;
  height: 18px;
  border-bottom:
    4px solid #7c3f3f;
  border-radius:
    0 0 50% 50%;
}
/* =========================
   NECK
========================= */
.neck {
  position: absolute;
  top: 225px;
  left: 128px;
  width: 55px;
  height: 55px;
  background: #efbd99;
}
/* =========================
   BODY
========================= */
.body {
  position: absolute;
  top: 260px;
  left: 32px;
  width: 245px;
  height: 270px;
  background: #8fa7b5;
  border-radius:
    90px 90px 25px 25px;
}
/* =========================
   SPEECH BUBBLE
========================= */
.speech-bubble {
  position: absolute;
  z-index: 30;
  left:
    calc(50% + 120px);
  bottom: 360px;
  width: 330px;
  min-height: 100px;
  background: white;
  padding: 20px 22px;
  border-radius: 22px;
  box-shadow:
    0 8px 30px
    rgba(0,0,0,0.12);
  font-size: 17px;
  line-height: 1.45;
  transition:
    opacity 0.2s ease,
    transform 0.2s ease;
}
/* speech bubble tail */
.speech-bubble::before {
  content: "";
  position: absolute;
  left: -18px;
  bottom: 30px;
  width: 0;
  height: 0;
  border-top:
    14px solid transparent;
  border-bottom:
    14px solid transparent;
  border-right:
    20px solid white;
}
/* Sara name */
.sara-name {
  display: block;
  font-size: 12px;
  font-weight: 800;
  color: #6b7280;
  margin-bottom: 7px;
  text-transform: uppercase;
  letter-spacing: 0.8px;
}
/* =========================
   DESK
========================= */
.desk {
  position: absolute;
  bottom: 0;
  left: -5%;
  width: 110%;
  height: 115px;
  background: #8b6a50;
  z-index: 10;
  box-shadow:
    0 -8px 25px
    rgba(0,0,0,0.12);
}
.desk::before {
  content: "";
  position: absolute;
  top: -10px;
  left: 0;
  width: 100%;
  height: 15px;
  background: #76563e;
}
/* =========================
   QUESTION BAR
========================= */
.question-area {
  position: absolute;
  z-index: 50;
  left: 50%;
  bottom: 22px;
  transform:
    translateX(-50%);
  width:
    min(720px, 90%);
  display: flex;
  gap: 8px;
}
.question-area input {
  flex: 1;
  padding:
    15px 18px;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  outline: none;
  box-shadow:
    0 3px 15px
    rgba(0,0,0,0.12);
}
.question-area button {
  border: none;
  background: #17202a;
  color: white;
  padding:
    0 22px;
  border-radius: 12px;
  font-weight: 700;
  cursor: pointer;
}
.question-area button:hover {
  opacity: 0.85;
}
/* microphone */
.mic-button {
  width: 52px;
  padding: 0 !important;
  font-size: 19px;
}
/* =========================
   MOBILE
========================= */
@media (max-width: 700px) {
  body {
    overflow: hidden;
  }
  .window {
    display: none;
  }
  .sara {
    transform:
      translateX(-50%)
      scale(0.72);
    transform-origin:
      bottom center;
    bottom: 60px;
  }
  .speech-bubble {
    left: 50%;
    bottom: 380px;
    transform:
      translateX(-50%);
    width: 86%;
    min-height: 85px;
    font-size: 15px;
  }
  .speech-bubble::before {
    display: none;
  }
  .patient-card {
    top: 15px;
    left: 15px;
  }
  .question-area {
    bottom: 15px;
  }
  .question-area button {
    padding:
      0 14px;
  }
}
/* =========================
   SPEAKING ANIMATION
========================= */
@keyframes talking {
  0% {
    transform:
      translateX(-50%)
      translateY(0);
  }
  50% {
    transform:
      translateX(-50%)
      translateY(-2px);
  }
  100% {
    transform:
      translateX(-50%)
      translateY(0);
  }
}
.sara.talking {
  animation:
    talking 0.5s ease-in-out;
}
</style>
</head>
