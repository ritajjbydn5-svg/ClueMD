<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #eef2f4;
}
/* HEADER */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #ddd;
    z-index: 100;
}
.logo {
    font-size: 23px;
    font-weight: bold;
}
.back {
    color: #18232d;
    text-decoration: none;
    font-weight: bold;
}
/* ROOM */
.room {
    position: fixed;
    top: 58px;
    left: 0;
    width: 100%;
    height: calc(100% - 58px);
    overflow: hidden;
    background: #f7f9fa;
}
/* PATIENT LABEL */
.patient {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
    z-index: 20;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient span {
    font-size: 11px;
    color: #777;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    width: 290px;
    height: 480px;
    left: 50%;
    bottom: 125px;
    transform: translateX(-50%);
    z-index: 10;
}
/* HAIR */
.hair {
    position: absolute;
    top: 5px;
    left: 43px;
    width: 205px;
    height: 220px;
    background: #493028;
    border-radius: 50%;
}
/* EARS */
.ear {
    position: absolute;
    top: 108px;
    width: 23px;
    height: 42px;
    background: #efbd99;
    border-radius: 50%;
}
.ear.left {
    left: 55px;
}
.ear.right {
    right: 55px;
}
/* FACE */
.face {
    position: absolute;
    top: 42px;
    left: 63px;
    width: 165px;
    height: 190px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* WORRIED EYEBROWS */
.eyebrow {
    position: absolute;
    top: 59px;
    width: 31px;
    height: 4px;
    background: #5b3930;
    border-radius: 5px;
}
.eyebrow.left {
    left: 30px;
    transform: rotate(14deg);
}
.eyebrow.right {
    right: 30px;
    transform: rotate(-14deg);
}
/* EYES */
.eye {
    position: absolute;
    top: 75px;
    width: 18px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 37px;
}
.eye.right {
    right: 37px;
}
/* SAD MOUTH */
.mouth {
    position: absolute;
    top: 133px;
    left: 50%;
    width: 42px;
    height: 20px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
/* NECK */
.neck {
    position: absolute;
    top: 220px;
    left: 118px;
    width: 55px;
    height: 55px;
    background: #efbd99;
}
/* BODY */
.body {
    position: absolute;
    top: 255px;
    left: 23px;
    width: 245px;
    height: 250px;
    background: #8da6b5;
    border-radius: 90px 90px 25px 25px;
}
/* =========================
   SPEECH
========================= */
.speech {
    display: none;
    position: fixed;
    left: 50%;
    top: 105px;
    transform: translateX(-50%);
    width: min(430px, 86%);
    background: white;
    padding: 18px;
    border-radius: 20px;
    box-shadow: 0 7px 25px rgba(0,0,0,.15);
    font-size: 15px;
    line-height: 1.45;
    z-index: 200;
}
.speech.visible {
    display: block;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
/* DESK */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 100px;
    background: #8b6a50;
    z-index: 30;
}
/* =========================
   INPUT PANEL
========================= */
#inputPanel {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 88px;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: white;
    padding: 14px;
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
    z-index: 1000;
}
#inputPanel.visible {
    display: block;
}
#panelTitle {
    font-weight: bold;
    margin-bottom: 9px;
    font-size: 15px;
}
.inputRow {
    display: flex;
    gap: 8px;
}
#answerInput {
    flex: 1;
    min-width: 0;
    border: 1px solid #ccd3d8;
    border-radius: 9px;
    padding: 12px;
    font-size: 16px;
    outline: none;
}
#sendButton {
    border: none;
    background: #18232d;
    color: white;
    border-radius: 9px;
    padding: 0 16px;
    font-weight: bold;
}
/* =========================
   BOTTOM ICONS
========================= */
#buttons {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 5000;
}
.iconButton {
    width: 60px;
    height: 55px;
    border: 2px solid #18232d;
    border-radius: 15px;
    background: white;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,.3);
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation;
}
.iconButton:active {
    transform: scale(.9);
}
/* MOBILE */
@media(max-width:700px) {
    .sara {
        transform:
            translateX(-50%)
            scale(.70);
        transform-origin: bottom center;
        bottom: 110px;
    }
    #buttons {
        bottom: 15px;
    }
    .iconButton {
        width: 58px;
        height: 52px;
    }
}
/* BLINK */
.sara.blink .eye {
    height: 2px;
}
</style>
</head>

<header>
<div class="logo">
    ClueMD
</div>
<a
    class="back"
    href="case001.html"
>
    ← Case 001
</a>
</header>
<!-- ROOM -->
<div class="room">

<div class="patient">

    </span>
</div>

<div
    class="sara"
    id="sara"
>
    <div class="hair"></div>

    <div class="face">

        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!-- SPEECH -->
<div
    id="speech"
    class="speech"
>
    <span class="speech-name">
        SARA
    </span>
    <span id="speechText"></span>
</div>
<div class="desk"></div>
</div>
<!-- =========================
     INPUT PANEL
========================= -->
<div id="inputPanel">
<div id="panelTitle">
    Ask Sara a question
</div>
<div class="inputRow">
    <input
        id="answerInput"
        type="text"
        placeholder="Type your question..."
        autocomplete="off"
    >
    <button
        id="sendButton"
        type="button"
        onclick="sendInput()"
    >
        Send
    </button>
</div>
</div>
<!-- =========================
     THREE BUTTONS
========================= -->
<div id="buttons">
<button
    class="iconButton"
    type="button"
    onclick="keyboard()"
>
    ⌨️
</button>
<button
    class="iconButton"
    type="button"
    onclick="microphone()"
>
    🎙️
</button>
<button
    class="iconButton"
    type="button"
    onclick="diagnosis()"
>
    🔎
</button>
</div>
<script>
/* =========================
   VARIABLES
========================= */
var mode = "question";

    document.getElementById("inputPanel");

    document.getElementById("answerInput");

========================= */
function keyboard() {
    mode = "question";
    title.innerHTML =
        "Ask Sara a question";
    input.placeholder =
        "Type your question...";
    input.value = "";
    panel.classList.add("visible");
    setTimeout(function() {
        input.focus();
    }, 100);
}
/* =========================
   MICROPHONE
========================= */
function microphone() {
    var Recognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
    if (!Recognition) {
        keyboard();
        speechText.innerHTML =
            "I can't use the microphone here. You can type your question instead.";
        speech.classList.add("visible");
        return;
    }
    var recognition =
        new Recognition();
    recognition.lang =
        "en-US";
    recognition.interimResults =
        false;
    recognition.onresult =
        function(event) {
            input.value =
                event.results[0][0].transcript;
            mode = "question";
            sendInput();
        };
    recognition.onerror =
        function() {
            keyboard();
        };
    recognition.start();
}
