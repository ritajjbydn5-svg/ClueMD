<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    overflow: hidden;
    color: #18232d;
}
header {
    height: 64px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
    border-bottom: 1px solid #ddd;
}
.logo {
    font-size: 24px;
    font-weight: bold;
}
.back {
    text-decoration: none;
    color: #18232d;
    font-weight: bold;
}
.clinic {
    height: calc(100vh - 64px);
    position: relative;
    background: #f7f9fa;
}
/* =========================
   PATIENT LABEL
========================= */
.patient {
    position: absolute;
    top: 20px;
    left: 20px;
    background: white;
    padding: 12px 17px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    z-index: 20;
}
.patient b {
    display: block;
    font-size: 18px;
}
.patient small {
    color: #777;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    width: 310px;
    height: 530px;
    left: 50%;
    bottom: 65px;
    transform: translateX(-50%);
    z-index: 5;
}
/* hair */
.hair {
    position: absolute;
    top: 15px;
    left: 52px;
    width: 205px;
    height: 230px;
    background: #493028;
    border-radius: 50%;
}
/* ears */
.ear {
    position: absolute;
    top: 115px;
    width: 25px;
    height: 45px;
    background: #efbd99;
    border-radius: 50%;
    z-index: 1;
}
.ear.left {
    left: 64px;
}
.ear.right {
    right: 64px;
}
/* face */
.face {
    position: absolute;
    top: 48px;
    left: 72px;
    width: 165px;
    height: 190px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* eyes */
.eye {
    position: absolute;
    top: 76px;
    width: 18px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
    transition: .15s;
}
.eye.left {
    left: 37px;
}
.eye.right {
    right: 37px;
}
/* sad eyebrows */
.eyebrow {
    position: absolute;
    top: 60px;
    width: 30px;
    height: 4px;
    background: #5b3930;
    border-radius: 5px;
}
.eyebrow.left {
    left: 30px;
    transform: rotate(15deg);
}
.eyebrow.right {
    right: 30px;
    transform: rotate(-15deg);
}
/* sad mouth */
.mouth {
    position: absolute;
    top: 132px;
    left: 50%;
    width: 42px;
    height: 20px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
/* neck */
.neck {
    position: absolute;
    top: 225px;
    left: 128px;
    width: 55px;
    height: 55px;
    background: #efbd99;
}
/* body */
.body {
    position: absolute;
    top: 260px;
    left: 32px;
    width: 245px;
    height: 270px;
    background: #8da6b5;
    border-radius: 90px 90px 25px 25px;
}
/* blink */
.sara.blink .eye {
    height: 2px;
}
/* =========================
   SPEECH
========================= */
.speech {
    position: absolute;
    z-index: 30;
    left: calc(50% + 120px);
    bottom: 355px;
    width: 350px;
    background: white;
    padding: 20px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    font-size: 17px;
    line-height: 1.45;
}
.speech::before {
    content: "";
    position: absolute;
    left: -18px;
    bottom: 30px;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    border-right: 20px solid white;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
/* =========================
   DESK
========================= */
.desk {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    height: 110px;
    background: #8b6a50;
    z-index: 10;
}
/* =========================
   CONTROLS
========================= */
.controls {
    position: absolute;
    z-index: 100;
    bottom: 25px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    align-items: center;
}
/* all buttons */
.control {
    width: 58px;
    height: 52px;
    border: none;
    border-radius: 14px;
    background: white;
    box-shadow: 0 5px 20px rgba(0,0,0,.18);
    font-size: 23px;
    cursor: pointer;
}
.control:hover {
    transform: translateY(-2px);
}
/* =========================
   QUESTION AREA
========================= */
.question-area {
    display: none;
    position: absolute;
    z-index: 200;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%);
    width: min(700px, 90%);
    background: white;
    padding: 10px;
    border-radius: 15px;
    box-shadow: 0 7px 25px rgba(0,0,0,.18);
}
.question-area.open {
    display: flex;
    gap: 8px;
}
.question-area input {
    flex: 1;
    border: none;
    outline: none;
    font-size: 16px;
    padding: 12px;
}
.question-area button {
    border: none;
    border-radius: 10px;
    background: #18232d;
    color: white;
    padding: 0 16px;
    font-weight: bold;
}
/* mobile */
@media(max-width:700px) {
    .speech {
        left: 50%;
        bottom: 370px;
        transform: translateX(-50%);
        width: 82%;
        font-size: 15px;
    }
    .speech::before {
        display: none;
    }
    .sara {
        transform:
            translateX(-50%)
            scale(.72);
        transform-origin: bottom center;
    }
}
</style>
</head>
<body>
<header>
<div class="logo">
    ClueMD
</div>
<a href="case001.html" class="back">
    ← Case 001
</a>
</header>
<div class="clinic">
<div class="patient">
    <b>Sara</b>
    <small>
        17 years old · Case 001
    </small>
</div>
<!-- SARA -->
<div class="sara" id="sara">
    <div class="hair"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face">
        <div class="eyebrow left"></div>
        <div class="eyebrow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!-- SARA'S SPEECH -->
<div class="speech" id="speech">
    <span class="speech-name">
        SARA
    </span>
    Hi... I'm Sara. I've been having this really bad pain since yesterday. It has been getting worse, and I'm starting to feel scared.
</div>
<!-- DESK -->
<div class="desk"></div>
<!-- QUESTION AREA -->
<div
    class="question-area"
    id="questionArea"
>
    <input
        id="question"
        type="text"
        placeholder="Ask Sara a question..."
    >
</div>
<!-- CONTROLS -->
<div class="controls">
    <!-- KEYBOARD -->
    <button
        type="button"
        class="control"
        onclick="openKeyboard()"
        aria-label="Keyboard"
    >
        ⌨️
    </button>
    <!-- MICROPHONE -->
    <button
        type="button"
        class="control"
        onclick="microphone()"
        aria-label="Microphone"
    >
        🎙️
    </button>
    <!-- SEARCH / ANSWER -->
    <button
        type="button"
        class="control"
        onclick="submitQuestion()"
        aria-label="Ask Sara"
    >
        🔎
    </button>
</div>
</div>
<script>
/* =========================
   ELEMENTS
========================= */
const questionArea =
    document.getElementById("questionArea");
const question =
    document.getElementById("question");
const speech =
    document.getElementById("speech");
const sara =
    document.getElementById("sara");
/* =========================
   KEYBOARD
========================= */
function openKeyboard() {
    questionArea.classList.add("open");
    question.focus();
}

   SEARCH / ASK
========================= */

    const q =
        question.value

            .toLowerCase();

        q.includes("reason") ||

            "I've been having this pain since yesterday. It started getting worse, so I decided I needed to see someone.";
    }

        q.includes("symptom") ||
        q.includes("feel") ||
        q.includes("wrong") ||
        q.includes("problem")
    ) {
        answer =
            "My lower right abdomen really hurts. I've also been feeling nauseous and I don't really feel like eating.";
    }

    else if (
        q.includes("where") ||
        q.includes("location") ||
        q.includes("side") ||
        q.includes("part")
    ) {
        answer =
            "It's mostly on the lower right side of my abdomen.";
    }
    /* timing */
    else if (
        q.includes("when") ||
        q.includes("started") ||
        q.includes("begin") ||
        q.includes("began") ||
        q.includes("long")
    ) {
        answer =
            "It started yesterday. It wasn't as bad at first, but it has gotten worse.";
    }
    /* severity */
    else if (
        q.includes("how bad") ||
        q.includes("severe") ||
        q.includes("severity") ||
        q.includes("pain scale") ||
        q.includes("out of 10")
    ) {
        answer =
            "I'd say it's about a 7 out of 10 right now.";
    }
    /* nausea */
    else if (
        q.includes("nausea") ||
        q.includes("nauseous") ||
        q.includes("sick")
    ) {
        answer =
            "Yes, I feel pretty nauseous.";
    }
    /* vomiting */
    else if (
        q.includes("vomit") ||
        q.includes("throw up")
    ) {
        answer =
            "No, I haven't vomited.";
    }

    else if (
