<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara - ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #eef2f4;
}
/* HEADER */
.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #ddd;
    z-index: 10;
}
.logo {
    font-size: 23px;
    font-weight: bold;
}
.back {
    text-decoration: none;
    color: #18232d;
    font-weight: bold;
}
/* ROOM */
.room {
    position: fixed;
    top: 58px;
    left: 0;
    width: 100%;
    height: calc(100% - 58px);
    overflow: hidden;
    background: #f6f8f9;
}
/* PATIENT LABEL */
.patient {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 3px 12px rgba(0,0,0,.1);
    z-index: 20;
}
.patient-name {
    font-size: 17px;
    font-weight: bold;
}
.patient-info {
    font-size: 11px;
    color: #777;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    left: 50%;
    bottom: 105px;
    width: 270px;
    height: 430px;
    transform: translateX(-50%);
    z-index: 5;
}
/* HAIR */
.hair {
    position: absolute;
    top: 0;
    left: 38px;
    width: 195px;
    height: 205px;
    background: #493028;
    border-radius: 50%;
}
/* EARS */
.ear {
    position: absolute;
    top: 105px;
    width: 22px;
    height: 40px;
    background: #efbd99;
    border-radius: 50%;
}
.ear-left {
    left: 49px;
}
.ear-right {
    right: 49px;
}
/* FACE */
.face {
    position: absolute;
    top: 38px;
    left: 57px;
    width: 157px;
    height: 180px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* EYEBROWS */
.brow {
    position: absolute;
    top: 57px;
    width: 30px;
    height: 4px;
    background: #57382e;
    border-radius: 5px;
}
.brow-left {
    left: 28px;
    transform: rotate(14deg);
}
.brow-right {
    right: 28px;
    transform: rotate(-14deg);
}
/* EYES */
.eye {
    position: absolute;
    top: 73px;
    width: 17px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye-left {
    left: 35px;
}
.eye-right {
    right: 35px;
}
/* MOUTH */
.mouth {
    position: absolute;
    top: 132px;
    left: 50%;
    width: 40px;
    height: 18px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
/* NECK */
.neck {
    position: absolute;
    top: 210px;
    left: 109px;
    width: 52px;
    height: 55px;
    background: #efbd99;
}
/* BODY */
.body {
    position: absolute;
    top: 250px;
    left: 13px;
    width: 245px;
    height: 220px;
    background: #8da6b5;
    border-radius: 90px 90px 20px 20px;
}
/* =========================
   SPEECH BUBBLE
========================= */
.speech {
    display: none;
    position: fixed;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 430px;
    padding: 17px;
    background: white;
    border-radius: 20px;
    box-shadow: 0 7px 25px rgba(0,0,0,.15);
    z-index: 100;
}
.speech.show {
    display: block;
}
.speech-title {
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
/* DESK */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 95px;
    background: #8b6a50;
    z-index: 8;
}
/* =========================
   INPUT BOX
========================= */
.input-panel {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 90px;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: white;
    padding: 14px;
    border-radius: 15px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
    z-index: 500;
}
.input-panel.show {
    display: block;
}
.input-title {
    font-weight: bold;
    margin-bottom: 9px;
    font-size: 15px;
}
.input-row {
    display: flex;
    gap: 8px;
}
.input {
    flex: 1;
    min-width: 0;
    border: 1px solid #ccc;
    border-radius: 9px;
    padding: 12px;
    font-size: 16px;
    outline: none;
}
.send {
    border: none;
    border-radius: 9px;
    background: #18232d;
    color: white;
    padding: 0 16px;
    font-weight: bold;
}
/* =========================
   ICONS
========================= */
.controls {
    position: fixed;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 1000;
}
.icon {
    width: 60px;
    height: 55px;
    border: 2px solid #18232d;
    border-radius: 15px;
    background: white;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 5px 18px rgba(0,0,0,.3);
    -webkit-appearance: none;
    appearance: none;
}
.icon:active {
    transform: scale(.9);
}
/* MOBILE */
@media(max-width:700px) {
    .sara {
        bottom: 105px;
        transform:
            translateX(-50%)
            scale(.72);
        transform-origin: bottom center;
    }
    .controls {
        bottom: 13px;
    }
    .icon {
        width: 58px;
        height: 52px;
    }
}
</style>
</head>
<body>
<!-- HEADER -->
<div class="header">
<div class="logo">
    ClueMD
</div>
<a
    class="back"
    href="case001.html"
>
    ← Case 001
</a>
</div>
<!-- ROOM -->
<div class="room">
<!-- PATIENT -->
<div class="patient">
    <div class="patient-name">
        Sara
    </div>
    <div class="patient-info">
        17 years old · Case 001
    </div>
</div>
<!-- SARA -->
<div class="sara">
    <div class="hair"></div>
    <div class="ear ear-left"></div>
    <div class="ear ear-right"></div>
    <div class="face">
        <div class="brow brow-left"></div>
        <div class="brow brow-right"></div>
        <div class="eye eye-left"></div>
        <div class="eye eye-right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!-- SARA'S SPEECH -->
<div
    id="speech"
    class="speech"
>
    <div class="speech-title">
        SARA
    </div>
    <div id="speechText"></div>
</div>
<div class="desk"></div>
</div>
<!-- =========================
     INPUT PANEL
========================= -->
<div
    id="inputPanel"
    class="input-panel"
>
<div
    id="inputTitle"
    class="input-title"
>
    Ask Sara a question
</div>
<div class="input-row">
    <input
        id="input"
        class="input"
        type="text"
        placeholder="Type your question..."
    >
    <button
        class="send"
        type="button"
        onclick="send()"
    >
        Send
    </button>
</div>
</div>
<!-- =========================
     THREE BUTTONS
========================= -->
<div class="controls">
<!-- KEYBOARD -->
<button
    class="icon"
    type="button"
    onclick="openKeyboard()"
>
    ⌨️
</button>
<!-- MICROPHONE -->
<button
    class="icon"
    type="button"
    onclick="openMicrophone()"
>
    🎙️
</button>
<!-- DIAGNOSIS -->
<button
    class="icon"
    type="button"
    onclick="openDiagnosis()"
>
    🔎
</button>
</div>
<script>
/* =========================
   VARIABLES
========================= */
var currentMode = "question";
var inputPanel =
    document.getElementById("inputPanel");
var inputTitle =
    document.getElementById("inputTitle");
var input =
    document.getElementById("input");
var speech =
    document.getElementById("speech");
var speechText =
    document.getElementById("speechText");
/* =========================
   KEYBOARD
========================= */
function openKeyboard() {
    currentMode = "question";
    inputTitle.innerHTML =
        "Ask Sara a question";
    input.placeholder =
        "Type your question...";
    input.value = "";
    inputPanel.classList.add("show");
    setTimeout(function() {
        input.focus();
    }, 100);
}
/* =========================
   MICROPHONE
========================= */
function openMicrophone() {
    var SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
        openKeyboard();
        return;
    }
    var recognition =
        new SpeechRecognition();
    recognition.lang =
        "en-US";
    recognition.interimResults =
        false;
    recognition.onresult =
        function(event) {
            input.value =
                event.results[0][0].transcript;
            currentMode =
                "question";
            send();
        };
    recognition.onerror =
        function() {
            openKeyboard();
        };
    recognition.start();
}
/* =========================
   DIAGNOSIS
========================= */
function openDiagnosis() {
    currentMode =
        "diagnosis";
    inputTitle.innerHTML =
        "What do you think Sara has?";
    input.placeholder =
        "Enter your diagnosis...";
    input.value = "";
    inputPanel.classList.add("show");
    setTimeout(function() {
        input.focus();
    }, 100);
}
/* =========================
   SEND
========================= */
function send() {
    var text =
        input.value.trim();
    if (text === "") {
        return;
    }
    /* DIAGNOSIS */
    if (currentMode === "diagnosis") {
        speechText.innerHTML =
            "Your diagnosis: <strong>"
            +
            text
            +
            "</strong>";
        speech.classList.add("show");
        inputPanel.classList.remove("show");
        input.value = "";
        return;
    }
    /* QUESTION */
    var q =
        text.toLowerCase();
    var answer;
    if (
        q.indexOf("where") !== -1 ||
        q.indexOf("location") !== -1 ||
        q.indexOf("side") !== -1
    ) {
        answer =
            "It'
