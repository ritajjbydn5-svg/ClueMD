<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #eef2f4;
}
.header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #ddd;
    z-index: 100;
}
.logo {
    font-size: 23px;
    font-weight: bold;
}
.back {
    text-decoration: none;
    color: #18232d;
    font-weight: bold;
}
.room {
    position: fixed;
    top: 58px;
    left: 0;
    width: 100%;
    height: calc(100% - 58px);
    overflow: hidden;
    background: #f7f9fa;
}
.patient {
    position: absolute;
    top: 15px;
    left: 15px;
    background: white;
    padding: 10px 15px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.1);
    z-index: 20;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient span {
    font-size: 11px;
    color: #777;
}
/* SARA */
.sara {
    position: absolute;
    width: 270px;
    height: 430px;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    z-index: 5;
}
.hair {
    position: absolute;
    top: 0;
    left: 38px;
    width: 195px;
    height: 205px;
    background: #493028;
    border-radius: 50%;
}
.ear {
    position: absolute;
    top: 105px;
    width: 22px;
    height: 40px;
    background: #efbd99;
    border-radius: 50%;
}
.ear.left {
    left: 49px;
}
.ear.right {
    right: 49px;
}
.face {
    position: absolute;
    top: 38px;
    left: 57px;
    width: 157px;
    height: 180px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
.brow {
    position: absolute;
    top: 57px;
    width: 30px;
    height: 4px;
    background: #57382e;
    border-radius: 5px;
}
.brow.left {
    left: 28px;
    transform: rotate(14deg);
}
.brow.right {
    right: 28px;
    transform: rotate(-14deg);
}
.eye {
    position: absolute;
    top: 73px;
    width: 17px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 35px;
}
.eye.right {
    right: 35px;
}
.mouth {
    position: absolute;
    top: 132px;
    left: 50%;
    width: 40px;
    height: 18px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
.neck {
    position: absolute;
    top: 210px;
    left: 109px;
    width: 52px;
    height: 55px;
    background: #efbd99;
}
.body {
    position: absolute;
    top: 250px;
    left: 13px;
    width: 245px;
    height: 220px;
    background: #8da6b5;
    border-radius: 90px 90px 20px 20px;
}
/* SPEECH */
.speech {
    position: fixed;
    display: none;
    top: 100px;
    left: 50%;
    transform: translateX(-50%);
    width: 85%;
    max-width: 430px;
    background: white;
    padding: 18px;
    border-radius: 20px;
    box-shadow: 0 7px 25px rgba(0,0,0,.15);
    z-index: 300;
}
.speech:target {
    display: block;
}
.speech-title {
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
/* DESK */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 95px;
    background: #8b6a50;
    z-index: 8;
}
/* PANELS */
.panel {
    position: fixed;
    display: none;
    left: 50%;
    bottom: 88px;
    transform: translateX(-50%);
    width: 90%;
    max-width: 600px;
    background: white;
    padding: 15px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.3);
    z-index: 2000;
}
.panel:target {
    display: block;
}
.panel-title {
    font-weight: bold;
    margin-bottom: 10px;
}
.panel input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 9px;
    font-size: 16px;
}
.panel-note {
    margin-top: 9px;
    font-size: 12px;
    color: #777;
}
/* BUTTONS */
.controls {
    position: fixed;
    left: 50%;
    bottom: 15px;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 5000;
}
.icon {
    width: 60px;
    height: 55px;
    border: 2px solid #18232d;
    border-radius: 15px;
    background: white;
    font-size: 24px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    color: black;
    box-shadow: 0 5px 18px rgba(0,0,0,.3);
}
/* MOBILE */
@media(max-width:700px) {
    .sara {
        transform: translateX(-50%) scale(.72);
        transform-origin: bottom center;
        bottom: 105px;
    }
    .icon {
        width: 58px;
        height: 52px;
    }
}
</style>
</head>
<body>
<div class="header">
<div class="logo">
    ClueMD
</div>
<a class="back" href="case001.html">
    ← Case 001
</a>
</div>
<div class="room">
<div class="patient">
    <strong>Sara</strong>
    <span>17 years old · Case 001</span>
</div>
<div class="sara">
    <div class="hair"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face">
        <div class="brow left"></div>
        <div class="brow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<div class="desk"></div>
</div>
<!-- KEYBOARD PANEL -->
<div id="keyboard" class="panel">
<div class="panel-title">
    Ask Sara a question
</div>
<input
    type="text"
    placeholder="Type your question..."
>
<div class="panel-note">
    Type your question here. We can connect Sara's answers to this interview next.
</div>
<br>
<a href="#close" class="back">
    Close
</a>
</div>
<!-- DIAGNOSIS PANEL -->
<div id="diagnosis" class="panel">
<div class="panel-title">
    What do you think Sara has?
</div>
<input
    type="text"
    placeholder="Enter your diagnosis..."
>
<div class="panel-note">
    This is where you submit your final diagnosis.
</div>
<br>
<a href="#close" class="back">
    Close
</a>
</div>
<!-- SPEECH -->
<div id="close" class="speech">
<div class="speech-title">
    SARA
</div>
<div>
    I'm really worried. I don't feel very well.
</div>
</div>
<!-- THREE BUTTONS -->
<div class="controls">
<!-- KEYBOARD -->
<a
    href="#keyboard"
    class="icon"
    aria-label="Ask Sara"
>
    ⌨️
</a>
<!-- MICROPHONE -->
<a
    href="#keyboard"
    class="icon"
    aria-label="Microphone"
>
    🎙️
</a>
<!-- DIAGNOSIS -->
<a
    href="#diagnosis"
    class="icon"
    aria-label="Submit diagnosis"
>
    🔎
</a>
</div>
</body>
</html>
