<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}
body {
  font-family: Arial, sans-serif;
  background: #e9eef2;
  color: #17202a;
  min-height: 100vh;
}
header {
  height: 65px;
  background: white;
  border-bottom: 1px solid #dce1e5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 6%;
}
.logo {
  font-size: 23px;
  font-weight: 800;
  letter-spacing: 1px;
}
.back {
  color: #17202a;
  text-decoration: none;
  font-weight: 700;
}
.main {
  min-height: calc(100vh - 65px);
  display: flex;
  flex-direction: column;
}
/* =========================
   CLINIC
========================= */
.clinic {
  position: relative;
  height: 500px;
  overflow: hidden;
  background: #f7f9fa;
  display: flex;
  justify-content: center;
  align-items: flex-end;
}
.window {
  position: absolute;
  top: 35px;
  right: 8%;
  width: 170px;
  height: 120px;
  background: #dcecf5;
  border: 8px solid white;
  box-shadow: 0 8px 25px rgba(0,0,0,0.06);
}
.window::before {
  content: "";
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 3px;
  background: white;
}
.window::after {
  content: "";
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 3px;
  background: white;
}
/* =========================
   SARA
========================= */
.sara {
  position: relative;
  width: 310px;
  height: 440px;
  z-index: 3;
}
.hair {
  position: absolute;
  top: 15px;
  left: 52px;
  width: 205px;
  height: 225px;
  background: #4a3028;
  border-radius: 48% 48% 42% 42%;
  z-index: 1;
}
.head {
  position: absolute;
  top: 42px;
  left: 72px;
  width: 165px;
  height: 190px;
  background: #f2c7a5;
  border-radius: 48% 48% 45% 45%;
  z-index: 2;
}
.ear {
  position: absolute;
  width: 25px;
  height: 45px;
  background: #efbd99;
  top: 110px;
  border-radius: 50%;
  z-index: 1;
}
.ear.left {
  left: 65px;
}
.ear.right {
  right: 65px;
}
.eye {
  position: absolute;
  top: 75px;
  width: 18px;
  height: 12px;
  background: #30241f;
  border-radius: 50%;
  transition: height 0.12s ease;
}
.eye.left {
  left: 38px;
}
.eye.right {
  right: 38px;
}
.sara.blink .eye {
  height: 2px;
}
.mouth {
  position: absolute;
  left: 50%;
  top: 125px;
  width: 35px;
  height: 12px;
  border-bottom: 3px solid #7c3f3f;
  border-radius: 0 0 50% 50%;
  transform: translateX(-50%);
  transition: all 0.2s ease;
}
.sara.worried .mouth {
  border-bottom: none;
  border-top: 3px solid #7c3f3f;
  border-radius: 50% 50% 0 0;
}
.sara.pained .mouth {
  width: 28px;
  height: 20px;
  border: 3px solid #7c3f3f;
  border-radius: 50%;
}
.sara.surprised .mouth {
  width: 22px;
  height: 28px;
  border: 3px solid #7c3f3f;
  border-radius: 50%;
}
.sara.nauseous .mouth {
  width: 30px;
  height: 8px;
  border-bottom: 3px solid #7c3f3f;
  border-radius: 50%;
}
.sara.happy .mouth {
  width: 40px;
  height: 18px;
  border-bottom: 4px solid #7c3f3f;
  border-radius: 0 0 50% 50%;
}
.neck {
  position: absolute;
  top: 215px;
  left: 128px;
  width: 55px;
  height: 50px;
  background: #efbd99;
}
.body {
  position: absolute;
  top: 245px;
  left: 32px;
  width: 245px;
  height: 210px;
  background: #8fa7b5;
  border-radius: 90px 90px 25px 25px;
}
/* =========================
   DESK
========================= */
.desk {
  position: absolute;
  bottom: 0;
  left: -10%;
  width: 120%;
  height: 90px;
  background: #8b6a50;
  z-index: 5;
  box-shadow: 0 -8px 20px rgba(0,0,0,0.12);
}
.desk-top {
  position: absolute;
  top: -10px;
  width: 100%;
  height: 15px;
  background: #76563e;
}
/* =========================
   PATIENT INFO
========================= */
.patient-card {
  position: absolute;
  top: 20px;
  left: 20px;
  background: white;
  padding: 15px 18px;
  border-radius: 12px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.08);
  z-index: 10;
}
.patient-card strong {
  display: block;
  font-size: 18px;
}
.patient-card span {
  font-size: 12px;
  color: #6b7280;
}
/* =========================
   CHAT
========================= */
.chat-section {
  background: white;
  padding: 18px;
  border-top: 1px solid #dce1e5;
}
.chat-box {
  max-width: 850px;
  margin: auto;
}
.messages {
  height: 190px;
  overflow-y: auto;
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-bottom: 12px;
}
.message {
  max-width: 80%;
  padding: 11px 14px;
  border-radius: 14px;
  line-height: 1.4;
  font-size: 14px;
}
.sara-message {
  background: #edf1f4;
  align-self: flex-start;
}
.user-message {
  background: #17202a;
  color: white;
  align-self: flex-end;
}
.chat-input {
  display: flex;
  gap: 8px;
}
.chat-input input {
  flex: 1;
  padding: 13px;
  border: 1px solid #ccd3d8;
  border-radius: 10px;
  font-size: 15px;
  outline: none;
}
.chat-input input:focus {
  border-color: #17202a;
}
.chat-input button {
  border: none;
  background: #17202a;
  color: white;
  padding: 0 20px;
  border-radius: 10px;
  font-weight: 700;
  cursor: pointer;
}
.chat-input button:hover {
  opacity: 0.85;
}
/* =========================
   QUICK QUESTIONS
========================= */
.quick-questions {
  max-width: 850px;
  margin: 10px auto 0;
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.quick-questions button {
  background: #f0f3f5;
  color: #17202a;
  border: 1px solid #d9dfe3;
  padding: 8px 11px;
  border-radius: 20px;
  cursor: pointer;
}
.quick-questions button:hover {
  background: #e4e9ed;
}
/* =========================
   MOBILE
========================= */
@media (max-width: 600px) {
  .clinic {
    height: 420px;
  }
  .window {
    display: none;
  }
  .sara {
    transform: scale(0.8);
    transform-origin: bottom center;
  }
  .messages {
    height: 180px;
  }
  .chat-input button {
    padding: 0 14px;
  }
}
</style>
</head>
<body>
<header>
  <div class="logo">
    ClueMD
  </div>
  <a class="back" href="case001.html">
    ← Case 001
  </a>
</header>
<div class="main">
<!-- =========================
     CLINIC
========================= -->
<section class="clinic">
  <div class="window"></div>
  <div class="patient-card">
    <strong>Sara</strong>
    <span>17 years old · Case 001</span>
  </div>
  <div class="sara" id="sara">
<div class="hair"></div>
<div class="ear left"></div>
<div class="ear right"></div>
<div class="head">
  <div class="eye left"></div>
  <div class="eye right"></div>
  <div class="mouth"></div>
</div>
<div class="neck"></div>
<div class="body"></div>
  </div>
  <div class="desk">
    <div class="desk-top"></div>
  </div>
</section>
<!-- =========================
     CHAT
========================= -->
<section class="chat-section">
  <div class="chat-box">
<div class="messages" id="messages">
  <div class="message sara-message">
    Hi... I'm Sara. I'm not really sure what's wrong. I've just been feeling strange lately.
  </div>
</div>
<div class="chat-input">
  <input
    id="userInput"
    type="text"
    placeholder="Ask Sara a question..."
    autocomplete="off"
  >
  <button onclick="sendMessage()">
    Ask
  </button>
</div>
<div class="quick-questions">
  <button onclick="askQuestion('What brought you in today?')">
    What brought you in?
  </button>
  <button onclick="askQuestion('What symptoms are you having?')">
    What symptoms do you have?
  </button>
  <button onclick="askQuestion('Where does it hurt?')">
    Where does it hurt?
  </button>
  <button onclick="askQuestion('When did this start?')">
    When did it start?
  </button>
  <button onclick="askQuestion('How bad is the pain?')">
    How bad is the pain?
  </button>
  <button onclick="askQuestion('Do you have a fever?')">
    Any fever?
  </button>
  <button onclick="askQuestion('Have you vomited?')">
    Any vomiting?
  </button>
  <button onclick="askQuestion('Are you taking any medications?')">
    Medications?
  </button>
</div>
  </div>
</section>
</div>
<script>
/* =====================================================
   CLUEMD CASE 001 — SARA
   This is a fictional educational patient.
   The student must discover the clues by interviewing her.
===================================================== */
/* =========================
   PATIENT DATA
========================= */
const patient = {
  name: "Sara",
  age: 17,
  symptoms:
    "I've been having pain in my lower right abdomen. I've also felt nauseous and I don't really feel like eating.",
  location:
    "It's mostly on the lower right side of my abdomen.",
  onset:
    "It started yesterday. At first it wasn't too bad, but it's gotten worse.",
  duration:
    "It's been going on since yesterday.",
  pain:
    "I'd say it's about a 7 out of 10 right now.",
  fever:
    "I felt really hot last night, but I didn't check my temperature.",
  vomiting:
    "No, I haven't vomited.",
  nausea:
    "Yes. I've been feeling pretty nauseous.",
  appetite:
    "I haven't really wanted to eat today.",
  bowel:
    "I haven't noticed anything unusual.",
  urine:
    "No, I don't think anything is different when I pee.",
  medications:
    "I don't take any regular medications.",
  allergies:
    "I'm not allergic to anything that I know of.",
  medicalHistory:
    "I've never had anything like this before.",
  worsening:
    "Walking around seems to make the pain worse.",
  pregnancy:
    "No.",
  familyHistory:
    "Nothing relevant that I know of."
};
/* =========================
   ELEMENTS
========================= */
const messages =
  document.getElementById("messages");
const input =
  document.getElementById("userInput");
const sara =
  document.getElementById("sara");
/* =========================
   ADD MESSAGE
========================= */
function addMessage(text, type) {
  const message =
    document.createElement("div");
  message.className =
    "message " + type;
  message.textContent =
    text;
  messages.appendChild(message);
  messages.scrollTop =
    messages.scrollHeight;
}
