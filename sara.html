<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sara | ClueMD</title>
<style>
* {
    box-sizing: border-box;
}
html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #eef2f4;
    color: #18232d;
}
/* HEADER */
header {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 58px;
    background: white;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    border-bottom: 1px solid #ddd;
    z-index: 1000;
}
.logo {
    font-size: 23px;
    font-weight: 800;
}
.back {
    text-decoration: none;
    color: #18232d;
    font-weight: bold;
}
/* MAIN ROOM */
.clinic {
    position: fixed;
    top: 58px;
    left: 0;
    width: 100%;
    height: calc(100% - 58px);
    overflow: hidden;
    background: #f7f9fa;
}
/* PATIENT LABEL */
.patient {
    position: absolute;
    top: 14px;
    left: 14px;
    background: white;
    padding: 10px 14px;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
    z-index: 100;
}
.patient strong {
    display: block;
    font-size: 17px;
}
.patient span {
    font-size: 11px;
    color: #777;
}
/* =========================
   SARA
========================= */
.sara {
    position: absolute;
    width: 290px;
    height: 480px;
    left: 50%;
    bottom: 135px;
    transform: translateX(-50%);
    z-index: 20;
}
.hair {
    position: absolute;
    top: 5px;
    left: 43px;
    width: 205px;
    height: 220px;
    background: #493028;
    border-radius: 50%;
}
.ear {
    position: absolute;
    top: 108px;
    width: 23px;
    height: 42px;
    background: #efbd99;
    border-radius: 50%;
    z-index: 1;
}
.ear.left {
    left: 55px;
}
.ear.right {
    right: 55px;
}
.face {
    position: absolute;
    top: 42px;
    left: 63px;
    width: 165px;
    height: 190px;
    background: #f2c7a5;
    border-radius: 48%;
    z-index: 2;
}
/* WORRIED EYEBROWS */
.eyebrow {
    position: absolute;
    top: 59px;
    width: 31px;
    height: 4px;
    background: #5b3930;
    border-radius: 5px;
}
.eyebrow.left {
    left: 30px;
    transform: rotate(14deg);
}
.eyebrow.right {
    right: 30px;
    transform: rotate(-14deg);
}
.eye {
    position: absolute;
    top: 75px;
    width: 18px;
    height: 11px;
    background: #30241f;
    border-radius: 50%;
}
.eye.left {
    left: 37px;
}
.eye.right {
    right: 37px;
}
/* SAD/WORRIED MOUTH */
.mouth {
    position: absolute;
    top: 133px;
    left: 50%;
    width: 42px;
    height: 20px;
    border-top: 4px solid #813f46;
    border-radius: 50% 50% 0 0;
    transform: translateX(-50%);
}
.neck {
    position: absolute;
    top: 220px;
    left: 118px;
    width: 55px;
    height: 55px;
    background: #efbd99;
}
.body {
    position: absolute;
    top: 255px;
    left: 23px;
    width: 245px;
    height: 250px;
    background: #8da6b5;
    border-radius: 90px 90px 25px 25px;
}
/* =========================
   SPEECH BUBBLE
========================= */
.speech {
    position: absolute;
    display: none;
    z-index: 300;
    left: calc(50% + 105px);
    top: 125px;
    width: 330px;
    background: white;
    padding: 18px;
    border-radius: 22px;
    box-shadow: 0 8px 30px rgba(0,0,0,.12);
    font-size: 16px;
    line-height: 1.45;
}
.speech.show {
    display: block;
}
.speech::before {
    content: "";
    position: absolute;
    left: -18px;
    bottom: 30px;
    border-top: 14px solid transparent;
    border-bottom: 14px solid transparent;
    border-right: 20px solid white;
}
.speech-name {
    display: block;
    font-size: 12px;
    font-weight: bold;
    color: #777;
    margin-bottom: 7px;
}
/* =========================
   DESK
========================= */
.desk {
    position: absolute;
    left: 0;
    bottom: 0;
    width: 100%;
    height: 105px;
    background: #8b6a50;
    z-index: 50;
}
/* =========================
   QUESTION PANEL
========================= */
.panel {
    display: none;
    position: fixed;
    left: 50%;
    bottom: 92px;
    transform: translateX(-50%);
    width: min(650px, 90%);
    background: white;
    padding: 14px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
    z-index: 2000;
}
.panel.show {
    display: block;
}
.panel-title {
    font-size: 15px;
    font-weight: bold;
    margin-bottom: 9px;
}
.panel-row {
    display: flex;
    gap: 8px;
}
.panel input {
    flex: 1;
    min-width: 0;
    border: 1px solid #ccd3d8;
    border-radius: 10px;
    padding: 12px;
    outline: none;
    font-size: 16px;
}
.panel button {
    border: none;
    border-radius: 10px;
    padding: 0 16px;
    background: #18232d;
    color: white;
    font-weight: bold;
    cursor: pointer;
}
/* =========================
   FIXED ICONS
========================= */
.controls {
    position: fixed;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 3000;
}
.control {
    width: 60px;
    height: 55px;
    padding: 0;
    border: 2px solid #18232d;
    border-radius: 15px;
    background: white;
    box-shadow: 0 5px 20px rgba(0,0,0,.30);
    font-size: 24px;
    cursor: pointer;
    pointer-events: auto;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
}
.control:active {
    transform: scale(.92);
}
/* MOBILE */
@media (max-width: 700px) {
    .sara {
        width: 270px;
        height: 440px;
        bottom: 120px;
        transform:
            translateX(-50%)
            scale(.70);
        transform-origin: bottom center;
    }
    .speech {
        top: 100px;
        left: 50%;
        transform: translateX(-50%);
        width: 84%;
        font-size: 14px;
    }
    .speech::before {
        display: none;
    }
    .control {
        width: 58px;
        height: 52px;
    }
}
/* BLINK */
.sara.blink .eye {
    height: 2px;
}
</style>
</head>
<body>
<header>
<div class="logo">ClueMD</div>
<a href="case001.html" class="back">
    ← Case 001
</a>
</header>
<div class="clinic">
<div class="patient">
    <strong>Sara</strong>
    <span>17 years old · Case 001</span>
</div>
<!-- SARA -->
<div class="sara" id="sara">
    <div class="hair"></div>
    <div class="ear left"></div>
    <div class="ear right"></div>
    <div class="face">
        <div class="eyebrow left"></div>
        <div class="eyebrow right"></div>
        <div class="eye left"></div>
        <div class="eye right"></div>
        <div class="mouth"></div>
    </div>
    <div class="neck"></div>
    <div class="body"></div>
</div>
<!--
    IMPORTANT:
    NO CHATBOX IS SHOWN HERE.
    Sara only speaks after you ask her something.
-->
<div class="speech" id="speech">
    <span class="speech-name">SARA</span>
    <span id="speechText"></span>
</div>
<div class="desk"></div>
</div>
<!-- =========================
     QUESTION / DIAGNOSIS PANEL
========================= -->
<div class="panel" id="questionPanel">
<div class="panel-title" id="panelTitle">
    Ask Sara a question
</div>
<div class="panel-row">
    <input
        id="panelInput"
        type="text"
        autocomplete="off"
        placeholder="Type your question..."
    >
    <button
        type="button"
        onclick="submitQuestion()"
    >
        Send
    </button>
</div>
</div>
<!-- =========================
     THREE ICONS
========================= -->
<div class="controls">
<!-- KEYBOARD -->
<button
    type="button"
    class="control"
    id="keyboardButton"
    onclick="openKeyboard()"
    aria-label="Ask Sara with keyboard"
>
    ⌨️
</button>
<!-- MICROPHONE -->
<button
    type="button"
    class="control"
    id="microphoneButton"
    onclick="startMicrophone()"
    aria-label="Ask Sara with microphone"
>
    🎙️
</button>
<!-- MAGNIFIER = DIAGNOSIS -->
<button
    type="button"
    class="control"
    id="diagnosisButton"
    onclick="openDiagnosis()"
    aria-label="Submit diagnosis"
>
    🔎
</button>
</div>
<script>
/* =========================
   ELEMENTS
========================= */
const panel =
    document.getElementById("questionPanel");
const panelTitle =
    document.getElementById("panelTitle");
const panelInput =
    document.getElementById("panelInput");
const speech =
    document.getElementById("speech");
const speechText =
    document.getElementById("speechText");
/* =========================
   MODE
========================= */
let currentMode = "question";
/* =========================
   KEYBOARD
========================= */
function openKeyboard() {
    currentMode = "question";
    panelTitle.textContent =
        "Ask Sara a question";
    panelInput.placeholder =
        "Type your question...";
    panelInput.value = "";
    panel.classList.add("show");
    setTimeout(function() {
        panelInput.focus();
    }, 100);
}

   SUBMIT QUESTION
========================= */
function submitQuestion() {
    if (currentMode !== "question") {
        submitDiagnosis();
        return;
    }

        return;

    if (

        question.includes("brought") ||
        question.includes("reason") ||

    ) {
        answer =
            "I've been having this pain since yesterday. It started getting worse, so I decided to come here.";
    }
    /* LOCATION */
    else if (
        question.includes("where") ||
        question.includes("location") ||
        question.includes("side")
    ) {
        answer =
            "It's mostly on the lower right side of my abdomen.";
    }

    else if (
